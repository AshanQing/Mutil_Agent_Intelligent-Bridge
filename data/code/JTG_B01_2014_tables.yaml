tables:
- id: T_B01_3_2_1_DESIGN_VEHICLE_DIMENSIONS
  meta:
    title: 设计车辆外廓尺寸
    source: JTG B01-2014, 表3.2.1
    clause: 3.2.1
    table_type: parameter
    applicability: 公路几何设计代表车型外廓尺寸
  structure:
    index_fields:
    - vehicle_type
    value_fields:
    - total_length
    - total_width
    - total_height
    - front_overhang
    - wheelbase
    - rear_overhang
    unit:
      total_length: m
      total_width: m
      total_height: m
      front_overhang: m
      wheelbase: m
      rear_overhang: m
  data:
  - condition:
      vehicle_type: 小客车
    value:
      total_length: 6
      total_width: 1.8
      total_height: 2
      front_overhang: 0.8
      wheelbase: '3.8'
      rear_overhang: 1.4
  - condition:
      vehicle_type: 大型客车
    value:
      total_length: 13.7
      total_width: 2.55
      total_height: 4
      front_overhang: 2.6
      wheelbase: 6.5+1.5
      rear_overhang: 3.1
  - condition:
      vehicle_type: 铰接客车
    value:
      total_length: 18
      total_width: 2.5
      total_height: 4
      front_overhang: 1.7
      wheelbase: 5.8+6.7
      rear_overhang: 3.8
  - condition:
      vehicle_type: 载重汽车
    value:
      total_length: 12
      total_width: 2.5
      total_height: 4
      front_overhang: 1.5
      wheelbase: '6.5'
      rear_overhang: 4
  - condition:
      vehicle_type: 铰接列车
    value:
      total_length: 18.1
      total_width: 2.55
      total_height: 4
      front_overhang: 1.5
      wheelbase: 3.3+11
      rear_overhang: 2.3
  lookup:
    input:
    - VAR_vehicle_type
    output:
    - VAR_vehicle_length
    - VAR_vehicle_width
    - VAR_vehicle_height
    method: exact_match
  related_refs:
    rules:
    - R_B01_3_2_1_DESIGN_VEHICLE
    tables: []
    formulas: []
    variables:
    - VAR_vehicle_type
    - VAR_vehicle_length
    - VAR_vehicle_width
    - VAR_vehicle_height
- id: T_B01_3_3_2_VEHICLE_CONVERSION_FACTOR
  meta:
    title: 各汽车代表车型及车辆折算系数
    source: JTG B01-2014, 表3.3.2
    clause: 3.3.2
    table_type: coefficient
    applicability: 交通量换算采用小客车为标准车型
  structure:
    index_fields:
    - vehicle_class
    value_fields:
    - conversion_factor
    - description
    unit:
      conversion_factor: '-'
  data:
  - condition:
      vehicle_class: 小客车
    value:
      conversion_factor: 1.0
      description: 座位≤19座的客车和载质量≤2t的货车
  - condition:
      vehicle_class: 中型车
    value:
      conversion_factor: 1.5
      description: 座位>19座的客车和2t<载质量≤7t的货车
  - condition:
      vehicle_class: 大型车
    value:
      conversion_factor: 2.5
      description: 7t<载质量≤20t的货车
  - condition:
      vehicle_class: 汽车列车
    value:
      conversion_factor: 4.0
      description: 载质量>20t的货车
  lookup:
    input:
    - VAR_vehicle_class
    output:
    - VAR_conversion_factor
    method: exact_match
  related_refs:
    rules:
    - R_B01_3_3_2_TRAFFIC_CONVERSION
    tables: []
    formulas: []
    variables:
    - VAR_vehicle_class
    - VAR_conversion_factor
