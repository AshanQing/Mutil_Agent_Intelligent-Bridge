- id: T_3362_APPB_B_3_4_NODE_STRENGTH_FACTOR
  meta:
    standard: JTG 3362-2018
    standard_name: 公路钢筋混凝土及预应力混凝土桥涵设计规范
    chapter: 附录B
    clause: B.3.4
    name: 三类典型节点的界面混凝土强度软化系数
    source: JTG 3362-2018, 表B.3.4
    description: 拉压杆模型中节点界面的混凝土强度软化系数βn。
    related_rules:
    - R_3362_APPB_B_3_4
    related_formulas:
    - F_3362_APPB_B_3_4_NODE_RESISTANCE
    related_variables:
    - VAR_node_type
    - VAR_beta_n_node_strength_factor
  schema:
    inputs:
    - node_type
    outputs:
    - beta_n
  constraints:
    matching_method: exact_match
    interpolation: false
    out_of_bounds: manual_review
    note: 节点类型需按附录B图示和受力模式识别。
  data:
  - node_type: CCC
    meaning: 杆件和支承面包围的节点区域
    beta_n: 0.85 * beta_c
  - node_type: CCT
    meaning: 单向拉杆锚固的节点区域
    beta_n: 0.75 * beta_c
  - node_type: CTT
    meaning: 双向拉杆锚固的节点区域
    beta_n: 0.65 * beta_c
  _source_file: 附录_表格库.yaml
  _source_chapter: APP
