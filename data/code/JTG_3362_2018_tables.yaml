    span_max_m: null
    span_range: L>=100
    reduction_factor: 1.0
  - section_type: 其他截面
    span_min_m: null
    span_max_m: 60
    span_range: L<=60
    reduction_factor: linear_interpolation
  - section_type: 其他截面
    span_min_m: 60
    span_max_m: 100
    span_range: 60<L<100
