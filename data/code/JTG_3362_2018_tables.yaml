    chapter: 第4章 结构设计基本规定
    clause: 4.5.2
    name: 环境类别划分表
    source: JTG 3362-2018, 表4.5.2
    description: 根据结构及构件表面直接接触环境确定环境类别。
    related_rules:
    - R_3362_CH04_042
    related_formulas: []
    related_variables:
    - VAR_environment_category
    - VAR_environment_condition
  schema:
    inputs:
    - condition
    outputs:
    - environment_category
  constraints:
    matching_method: condition
    interpolation: false
    out_of_bounds: manual_review
    note: 环境条件具有工程判断性，自动识别后应保留人工复核。
  data:
  - environment_category: I类-一般环境
    condition: 仅受混凝土碳化影响的环境
  - environment_category: II类-冻融环境
    condition: 受反复冻融影响的环境
  - environment_category: III类-近海或海洋氯化物环境
    condition: 受海洋环境下氯盐影响的环境
  - environment_category: IV类-除冰盐等其他氯化物环境
    condition: 受除冰盐等氯盐影响的环境
  - environment_category: V类-盐结晶环境
    condition: 受混凝土孔隙中硫酸盐结晶膨胀影响的环境
  - environment_category: VI类-化学腐蚀环境
    condition: 受酸碱性较强的化学物质侵蚀的环境
  - environment_category: VII类-磨蚀环境
    condition: 受风、水流或水中夹杂物的摩擦、切削、冲击等作用的环境
