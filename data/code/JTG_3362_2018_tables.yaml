- id: T_3362_CH04_4_3_4_THEORETICAL_SPAN
  meta:
    standard: JTG 3362-2018
    standard_name: 公路钢筋混凝土及预应力混凝土桥涵设计规范
    chapter: 第4章 结构设计基本规定
    clause: 4.3.4
    name: ρf、ρs的应用位置和理论跨径表
    source: JTG 3362-2018, 表4.3.4
    description: 用于箱形截面梁翼缘有效宽度计算中理论跨径li取值。
    related_rules:
    - R_3362_CH04_020
    related_formulas:
    - F_3362_CH04_4_3_4_1_BOX_GIRDER_FLANGE_EFFECTIVE_WIDTH_MIDSPAN
    - F_3362_CH04_4_3_4_2_BOX_GIRDER_FLANGE_EFFECTIVE_WIDTH_COEFFICIENT_MIDSPAN
    - F_3362_CH04_4_3_4_3_BOX_GIRDER_FLANGE_EFFECTIVE_WIDTH_SUPPORT
    - F_3362_CH04_4_3_4_4_BOX_GIRDER_FLANGE_EFFECTIVE_WIDTH_COEFFICIENT_SUPPORT
    related_variables:
    - VAR_box_girder_segment_position
    - VAR_3362_l_i
    - VAR_l_span
    - VAR_li_theoretical_span
    - VAR_region
    - VAR_structural_system
  schema:
    inputs:
    - structural_system
    - region
    outputs:
    - theoretical_span_factor
    - theoretical_span_expression
  constraints:
    matching_method: condition
    interpolation: false
    out_of_bounds: manual_review
    note: 表中连续梁边跨和中间跨理论跨径取值涉及结构布置，必要时人工复核。
  data:
  - structural_system: 简支梁
    region: 跨中部分梁段
    theoretical_span_factor: 1.0
    theoretical_span_expression: l_i = l
  - structural_system: 连续梁
    region: 边支点或跨中部分梁段
    theoretical_span_factor: 0.8
    theoretical_span_expression: l_i = 0.8l
  - structural_system: 连续梁
    region: 中间跨分梁段
    theoretical_span_factor: 0.6
    theoretical_span_expression: l_i = 0.6l，且中间支点li取0.2倍两相邻跨径之和
  - structural_system: 悬臂梁
    region: 悬臂段
    theoretical_span_factor: 1.5
    theoretical_span_expression: l_i = 1.5l
  _source_file: 04结构设计基本规定_表格库.yaml
  _source_chapter: '04'
  schema_original:
    inputs:
    - variable_id: VAR_structural_system
      field: structural_system
      name: 结构体系
      unit: '-'
      required: true
    - variable_id: VAR_region
      field: region
      name: 计算位置
      unit: '-'
      required: true
    outputs:
    - variable_id: VAR_li_theoretical_span
      field: theoretical_span_factor
      name: 理论跨径系数
      unit: '-'
    - variable_id: VAR_li_theoretical_span
      field: theoretical_span_expression
      name: 理论跨径表达
      unit: '-'
- id: T_3362_CH04_4_4_1_ARCH_POSITIVE_MOMENT_REDUCTION
  meta:
    standard: JTG 3362-2018
    standard_name: 公路钢筋混凝土及预应力混凝土桥涵设计规范
