    expression: 若 h ≥ b_i / 0.3，则 b_mi = b_i；否则根据计算位置选择公式：跨中部梁段先计算 rho_f，再计算 b_mi = rho_f * b_i；支点或悬臂段先计算 rho_s，再计算 b_mi =
