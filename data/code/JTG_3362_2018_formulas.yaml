  math:
    expression: s_v = (0.2e-6 * alpha2**2 * (2 + 0.6 * P) * sqrt(fcuk) * Asv * fsv * h0) / (zeta * gamma0 * Vd)**2
    variables:
    - VAR_alpha2_prestress_factor
