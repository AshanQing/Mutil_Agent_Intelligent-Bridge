- id: F_3362_CH05_5_2_2_1_BENDING_CAPACITY_TENSION_FLANGE
  formula_status: normative_formula_expanded
  meta:
    name: 矩形截面或受拉翼缘T形截面正截面抗弯承载力
    layer: layer3_ultimate_capacity_calculation
    source: JTG 3362-2018, 5.2.2条
    applicability: '仅采用纵向体内钢筋的矩形截面，或翼缘位于受拉边的T形截面受弯构件；材料: reinforced_concrete, prestressed_concrete；极限状态: ultimate_limit_state'
    standard: JTG 3362-2018
    standard_name: 公路钢筋混凝土及预应力混凝土桥涵设计规范
    chapter: 第5章 持久状况承载能力极限状态计算
    clause: 5.2.2
    description: 按JTG 3362-2018第5.2.2条式(5.2.2-1)～式(5.2.2-5)展开的正截面抗弯承载力计算与受压区高度校核。
    related_variables:
    - VAR_gamma0_structure_importance_factor
    - VAR_Md_bending_moment_design
    - VAR_fcd_concrete_compressive_strength_design
    - VAR_b_section_width
    - VAR_h0_effective_depth
    - VAR_x_compression_zone_height
    - VAR_xi_relative_compression_zone_height
    - VAR_xi_b_relative_limit_compression_zone_height
    - VAR_f_sd
    - VAR_f_sd_prime
    - VAR_f_pd
    - VAR_f_pd_prime
    - VAR_sigma_p0_prime
    - VAR_As
    - VAR_As_prime
    - VAR_Ap
    - VAR_Ap_prime
    - VAR_a_prime_compression_rebar_distance
    - VAR_a_p_prime_compression_prestress_distance
    - VAR_Mu_flexural_capacity
    - VAR_bending_capacity_check_result
    related_rules:
    - R_3362_CH05_5_2_2
    related_tables:
    - T_3362_CH05_5_2_1_RELATIVE_LIMIT_COMPRESSION_ZONE_HEIGHT
  math:
    expression: 'prestress_compression_effective_strength = fpd_prime - sigma_p0_prime

      force_equilibrium_lhs = fsd * As + fpd * Ap

      force_equilibrium_rhs = fcd * b * x + fsd_prime * As_prime + prestress_compression_effective_strength * Ap_prime

      check_force_equilibrium = abs(force_equilibrium_lhs - force_equilibrium_rhs) <= tolerance

      xi = x / h0

      Mu = fcd * b * x * (h0 - x / 2) + fsd_prime * As_prime * (h0 - a_s_prime) + prestress_compression_effective_strength
      * Ap_prime * (h0 - a_p_prime)

      check_x_limit = x <= xi_b * h0

      check_compression_rebar_position_positive_prestress = x >= 2 * max(a_s_prime, a_p_prime)

      check_compression_rebar_position_nonpositive_prestress = x >= 2 * a_s_prime

      check_capacity = gamma0 * Md <= Mu

      '
    variables:
    - VAR_gamma0_structure_importance_factor
    - VAR_Md_bending_moment_design
    - VAR_fcd_concrete_compressive_strength_design
    - VAR_b_section_width
    - VAR_h0_effective_depth
    - VAR_x_compression_zone_height
    - VAR_xi_b_relative_limit_compression_zone_height
    - VAR_f_sd
    - VAR_f_sd_prime
    - VAR_f_pd
    - VAR_f_pd_prime
    - VAR_sigma_p0_prime
    - VAR_As
    - VAR_As_prime
    - VAR_Ap
    - VAR_Ap_prime
    - VAR_a_prime_compression_rebar_distance
    - VAR_a_p_prime_compression_prestress_distance
    output:
    - VAR_xi_relative_compression_zone_height
    - VAR_Mu_flexural_capacity
    - VAR_bending_capacity_check_result
    dependencies:
    - T_3362_CH05_5_2_1_RELATIVE_LIMIT_COMPRESSION_ZONE_HEIGHT
    formula_clauses:
    - clause: 5.2.2-1
      expression: gamma0 * Md <= fcd * b * x * (h0 - x / 2) + fsd_prime * As_prime * (h0 - a_s_prime) + (fpd_prime - sigma_p0_prime)
        * Ap_prime * (h0 - a_p_prime)
    - clause: 5.2.2-2
      expression: fsd * As + fpd * Ap = fcd * b * x + fsd_prime * As_prime + (fpd_prime - sigma_p0_prime) * Ap_prime
    - clause: 5.2.2-3
      expression: x <= xi_b * h0
    - clause: 5.2.2-4
      expression: x >= 2 * a_prime when compressed ordinary and prestressing reinforcement are provided and (fpd_prime - sigma_p0_prime)
        > 0
    - clause: 5.2.2-5
      expression: x >= 2 * a_s_prime when only compressed ordinary reinforcement is provided, or when both compressed ordinary
        and prestressing reinforcement are provided and (fpd_prime - sigma_p0_prime) < 0
  constraints:
    pre:
    - fcd > 0
    - b > 0
    - h0 > 0
    - x > 0
    - xi_b is not null
    - gamma0 > 0
    - Md >= 0
    - As >= 0
    - Ap >= 0
    - As_prime >= 0
    - Ap_prime >= 0
    - fsd >= 0
    - fpd >= 0
    - fsd_prime >= 0
    - fpd_prime >= 0
    post:
    - check_force_equilibrium is computed
    - VAR_xi_relative_compression_zone_height is computed
    - VAR_Mu_flexural_capacity is computed
    - check_x_limit is computed
    - VAR_bending_capacity_check_result is computed
  execution:
    type: python
    logic: 按式(5.2.2-2)进行受压区高度x的力平衡校核，按式(5.2.2-1)计算抗弯承载力Mu，并按式(5.2.2-3)～式(5.2.2-5)进行受压区高度及受压钢筋位置条件校核；保留规范条文、公式编号与变量追溯信息。
    executable: true
    unit_system:
      force: N
      length: mm
      stress: MPa(N/mm^2)
      moment: N·mm
    notes:
    - 若计算书输入Md采用kN·m，应先换算为N·mm后代入。
    - 普通钢筋混凝土构件无预应力筋时，可取Ap=0、Ap_prime=0、fpd=0、fpd_prime=0、sigma_p0_prime=0。
    - 无受压普通钢筋参与计算时，可取As_prime=0、fsd_prime=0；a_s_prime仅在校核式(5.2.2-4)或式(5.2.2-5)需要时使用。
    - 式(5.2.2-4)中的a_prime在程序实现中按受压普通钢筋与受压预应力钢筋合力点距离的较大值处理。
  _source_file: 05持久状况承载能力极限状态计算_公式库.yaml
  _source_chapter: '05'
