- id: F_3362_CH04_4_3_4_3_BOX_GIRDER_FLANGE_EFFECTIVE_WIDTH_SUPPORT
  formula_status: normative
  meta:
    standard: JTG 3362-2018
    standard_name: 公路钢筋混凝土及预应力混凝土桥涵设计规范
    chapter: 第4章 结构设计基本规定
    clause: 4.3.4
    name: 箱形截面梁支点及悬臂段翼缘有效宽度
    source: JTG 3362-2018, 4.3.4条，式(4.3.4-3)
    layer: layer1_geometric_effective_width
    description: 计算箱形截面梁在简支梁支点、连续梁边支点及中间支点、悬臂梁悬臂段的翼缘有效宽度。
    related_rules:
    - R_3362_CH04_020
    related_tables:
    - T_3362_CH04_4_3_4_THEORETICAL_SPAN
    related_variables:
    - VAR_bi_flange_actual_width
    - VAR_bmi_flange_effective_width
    - VAR_li_theoretical_span
    - VAR_rho_s_flange_effective_width_coefficient_support
  math:
    expression: b_mi = rho_s * b_i
    variables:
    - VAR_rho_s_flange_effective_width_coefficient_support
    - VAR_bi_flange_actual_width
    output: VAR_bmi_flange_effective_width
  constraints:
    applicable_material:
    - reinforced_concrete
    - prestressed_concrete
    applicable_member:
    - box_girder
    limit_state: []
    applicable_position:
    - simply_supported_girder_support
    - continuous_girder_edge_support
    - continuous_girder_middle_support
    - cantilever_girder_cantilever_segment
    assumptions:
    - 适用于箱形截面梁腹板两侧上、下翼缘有效宽度计算
    - 理论跨径 l_i 应按表4.3.4确定
    - 当梁高 h ≥ b_i / 0.3 时，翼缘有效宽度应采用翼缘实际宽度
    valid_range:
    - variable_id: VAR_bi_flange_actual_width
      min: 0
      max: null
      unit: m
    - variable_id: VAR_li_theoretical_span
      min: 0
      max: null
      unit: m
    note: 需先按式(4.3.4-4)计算 rho_s。
  execution:
    executable: true
    execution_type: formula_calculation
    calculation_order: 2
    logic: 读取翼缘实际宽度 b_i 和理论跨径 l_i；调用式(4.3.4-4)计算 rho_s；计算 b_mi = rho_s * b_i；若梁高满足 h ≥ b_i / 0.3，则翼缘有效宽度采用翼缘实际宽度。
    error_handling:
      missing_input: raise_error
      out_of_range: manual_review
    type: formula_calculation
  _source_file: 04结构设计基本规定_公式库.yaml
  _source_chapter: '04'
- id: F_3362_CH04_4_3_4_4_BOX_GIRDER_FLANGE_EFFECTIVE_WIDTH_COEFFICIENT_SUPPORT
  formula_status: normative
  meta:
    standard: JTG 3362-2018
    standard_name: 公路钢筋混凝土及预应力混凝土桥涵设计规范
    chapter: 第4章 结构设计基本规定
    clause: 4.3.4
    name: 箱形截面梁支点及悬臂段翼缘有效宽度计算系数
    source: JTG 3362-2018, 4.3.4条，式(4.3.4-4)
    layer: layer1_geometric_effective_width_coefficient
    description: 计算简支梁支点、连续梁边支点及中间支点、悬臂梁悬臂段的翼缘有效宽度计算系数 rho_s。
    related_rules:
    - R_3362_CH04_020
    related_tables:
    - T_3362_CH04_4_3_4_THEORETICAL_SPAN
    related_variables:
    - VAR_bi_flange_actual_width
    - VAR_li_theoretical_span
    - VAR_rho_s_flange_effective_width_coefficient_support
  math:
    expression: rho_s = 21.86 * (b_i / l_i)^4 - 38.01 * (b_i / l_i)^3 + 24.57 * (b_i / l_i)^2 - 7.67 * (b_i / l_i) + 1.27
    variables:
    - VAR_bi_flange_actual_width
    - VAR_li_theoretical_span
    output: VAR_rho_s_flange_effective_width_coefficient_support
  constraints:
    applicable_material:
    - reinforced_concrete
    - prestressed_concrete
    applicable_member:
    - box_girder
    limit_state: []
    applicable_position:
    - simply_supported_girder_support
    - continuous_girder_edge_support
    - continuous_girder_middle_support
    - cantilever_girder_cantilever_segment
    assumptions:
    - b_i 为腹板两侧上、下翼缘的实际宽度
    - l_i 为理论跨径，应按表4.3.4确定
    valid_range:
    - variable_id: VAR_bi_flange_actual_width
      min: 0
      max: null
      unit: m
    - variable_id: VAR_li_theoretical_span
      min: 0
      max: null
      unit: m
    note: 该公式用于式(4.3.4-3)中 rho_s 的计算。
  execution:
    executable: true
    execution_type: formula_calculation
    calculation_order: 1
    logic: 计算 ratio = b_i / l_i；代入四次多项式计算 rho_s；输出支点及悬臂段翼缘有效宽度计算系数。
    error_handling:
      missing_input: raise_error
      out_of_range: manual_review
    type: formula_calculation
  _source_file: 04结构设计基本规定_公式库.yaml
  _source_chapter: '04'
