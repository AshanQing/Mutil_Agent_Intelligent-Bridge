    - VAR_h0_effective_depth
    - VAR_zeta_shear_share_factor
    - VAR_gamma0_structure_importance_factor
    - VAR_Vd_shear_force_design
    output: VAR_sv_stirrup_spacing
    dependencies: []
  constraints:
    pre:
    - 用于抗剪配筋设计的最不利剪力设计值Vd
    - zeta取正值
    - 依据用户补充截图恢复，建议后续结合清晰原文复核一次指数与系数。
    post:
    - VAR_sv_stirrup_spacing is computed
