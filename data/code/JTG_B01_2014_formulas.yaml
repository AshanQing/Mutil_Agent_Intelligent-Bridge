metadata:
  library_name: JTG_B01_2014_formula_registry
  standard: JTG B01-2014
  standard_code: JTG B01-2014
  architecture: six_layer_DAG
  formula_schema: compact_four_module
  file_version: v0.1
  standard_name: 公路工程技术标准
  library_type: formula_registry
  item_count: 16
