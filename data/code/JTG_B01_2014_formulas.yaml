  generation_note: 根据 library_reasonableness_review.md 修正：补充 formula_status、显式化规则调用表格/公式ID、标记人工复核规则、修正表9.1.5查表口径、标注变量误报风险。
  cross_standard_consistency_audit:
    date: '2026-06-28'
    method: ID uniqueness, cross-library reference integrity, reciprocal relation completion, formula-variable linkage, variable
      symbol/unit semantic conflict scan
    safe_modification_policy: 仅补充可由现有ID关系直接推出的反向引用和公式变量关联；未擅自改名、删项或修正规范数值。
    duplicate_id_scope_fix: 跨规范重复变量ID已按所属规范添加标准域前缀，并同步更新本规范四库内全部引用。
layers:
  layer0_global_context_materials:
    description: 全局上下文、交通量、服务水平及工程分类基础参数
    formulas:
    - F_B01_L0_VC_RATIO
  layer1_parameters_coefficients:
    description: 参数、系数、几何指标和中间量计算
    formulas:
    - F_B01_L1_AADT_SECONDARY_HIGHWAY
    - F_B01_L1_VKT_RATIO
    - F_B01_L1_LENGTH_RATIO
    - F_B01_L1_NETWORK_SERVICE_INDEX
    - F_B01_L1_CIRCULAR_CURVE_RADIUS
    - F_B01_L1_CLOTHOID_PARAMETER
    - F_B01_L1_BRIDGE_LANE_LOAD_PK_INTERPOLATION
    - F_B01_L1_HIGHWAY_II_LOAD_FACTOR
    - F_B01_L1_DESIGN_LANE_LOAD_TRANSVERSE_EFFECT
    - F_B01_L1_LONGITUDINAL_REDUCTION_EFFECT
    - F_B01_L1_PEDESTRIAN_LOAD_INTERPOLATION
    - F_B01_L1_PEDESTRIAN_DENSE_FACTOR
    - F_B01_L1_TUNNEL_PORTAL_TRANSITION_LENGTH
  layer2_standard_actions:
    description: 汽车及人群荷载等单项标准作用计算
    formulas:
    - F_B01_L2_LANE_LOAD_SHEAR_PK
  layer3_action_combinations:
    description: 作用效应组合计算，本标准未给出通用组合公式
    formulas: []
  layer4_section_resistance_properties:
    description: 截面抗力与几何特性，本标准未给出结构构件抗力公式
