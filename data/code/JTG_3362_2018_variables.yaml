  version: reasonableness_fixed_v0.2
  generated_from: chapter-level four libraries uploaded in conversation
  merge_policy: Rules/tables/formulas are de-duplicated by id with first occurrence kept. Variables are merged by id, preserving
    first semantic fields and unioning roles/relations.
  library_type: variable_registry
  item_count: 811
  generation_note: 根据审查报告进一步修正：清除blocking问题，补齐meta、execution、roles，规范表格schema，原则性无关联规则转context_only/manual_review。
  cross_standard_consistency_audit:
    date: '2026-06-28'
    method: ID uniqueness, cross-library reference integrity, reciprocal relation completion, formula-variable linkage, variable
      symbol/unit semantic conflict scan
    safe_modification_policy: 仅补充可由现有ID关系直接推出的反向引用和公式变量关联；未擅自改名、删项或修正规范数值。
    duplicate_id_scope_fix: 跨规范重复变量ID已按所属规范添加标准域前缀，并同步更新本规范四库内全部引用。
