    - VAR_F_w
    - VAR_D60_K
    - VAR_g
    - VAR_gamma_water
    - VAR_D60_v
  math:
    expression: F_w = K * A * gamma * v^2 / (2 * g)
    variables:
    - VAR_D60_K
    - VAR_A
    - VAR_gamma_water
    - VAR_D60_v
    - VAR_g
    output: VAR_F_w
    dependencies: []
  constraints:
