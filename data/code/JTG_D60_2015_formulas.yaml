metadata:
  library_name: JTG_D60_2015_formula_registry
  standard: JTG D60-2015
  standard_code: JTG D60-2015
  architecture: six_layer_DAG
  formula_schema: compact_four_module
  file_version: v0.1
  standard_name: 公路桥涵设计通用规范
  library_type: formula_registry
  version: reasonableness_fixed_v0.1
  generation_note: 根据 JTG_D60_2015_reasonableness_review.md 修正：补充 formula_status，回写表格/公式/变量关联，对人工判断语义规则标记 hybrid/manual_review，保留需人工复核的泛化变量。
  cross_standard_consistency_audit:
    date: '2026-06-28'
    method: ID uniqueness, cross-library reference integrity, reciprocal relation completion, formula-variable linkage, variable
      symbol/unit semantic conflict scan
    safe_modification_policy: 仅补充可由现有ID关系直接推出的反向引用和公式变量关联；未擅自改名、删项或修正规范数值。
    duplicate_id_scope_fix: 跨规范重复变量ID已按所属规范添加标准域前缀，并同步更新本规范四库内全部引用。
layers:
  layer0_global_context_materials:
    description: 全局上下文、工程分类、环境与材料基础参数
    formulas: []
  layer1_parameters_coefficients:
    description: 参数、系数和中间量计算
    formulas:
    - F_D60_L1_NAVIGATION_CLEARANCE_CORRECTION
    - F_D60_L1_EARTH_PRESSURE_COEFFICIENT_STATIC
    - F_D60_L1_ACTIVE_EARTH_PRESSURE_COEFFICIENT
    - F_D60_L1_SOIL_PRESSURE_WIDTH_GROUP_PILE
    - F_D60_L1_SOIL_PRESSURE_WIDTH_SMALL_COLUMN
    - F_D60_L1_SOIL_PRESSURE_WIDTH_LARGE_COLUMN
    - F_D60_L1_LATERAL_PRESSURE_COEFFICIENT
    - F_D60_L1_VEHICLE_IMPACT_COEFFICIENT
    - F_D60_L1_CENTRIFUGAL_FORCE_COEFFICIENT
    - F_D60_L1_BREAKING_FORCE_EQUIVALENT_WIDTH
    - F_D60_L1_RETAINING_WALL_DISTRIBUTION_LENGTH
    - F_D60_L1_VEHICLE_CONCENTRATED_LOAD_INTERPOLATION
    - F_D60_L1_PEDESTRIAN_LOAD_INTERPOLATION
  layer2_standard_actions:
    description: 单项作用标准值计算
    formulas:
    - F_D60_L2_STRUCTURE_SELF_WEIGHT
    - F_D60_L2_PRESTRESS_FORCE
    - F_D60_L2_EFFECTIVE_PRESTRESS
    - F_D60_L2_STATIC_EARTH_PRESSURE_AT_DEPTH
    - F_D60_L2_STATIC_EARTH_PRESSURE_RESULTANT
    - F_D60_L2_ACTIVE_EARTH_PRESSURE_NO_VEHICLE
    - F_D60_L2_ACTIVE_EARTH_PRESSURE_WITH_VEHICLE
    - F_D60_L2_FAILURE_ANGLE_ACTIVE_EARTH_PRESSURE
    - F_D60_L2_VERTICAL_FILL_PRESSURE
    - F_D60_L2_HORIZONTAL_FILL_PRESSURE
    - F_D60_L2_WATER_BUOYANCY
    - F_D60_L2_VEHICLE_IMPACT_ACTION
    - F_D60_L2_CENTRIFUGAL_FORCE
    - F_D60_L2_VEHICLE_INDUCED_SOIL_EQUIVALENT_HEIGHT
    - F_D60_L2_FLOWING_WATER_PRESSURE
    - F_D60_L2_ICE_PRESSURE_ON_PIER
    - F_D60_L2_ICE_PRESSURE_HORIZONTAL_COMPONENT
    - F_D60_L2_ICE_PRESSURE_VERTICAL_COMPONENT
    - F_D60_L2_SUPPORT_FRICTION_FORCE
    - F_D60_L2_DRIFT_IMPACT_FORCE
  layer3_action_combinations:
    description: 作用效应组合计算
    formulas:
    - F_D60_L3_ULS_BASIC_COMBINATION_STANDARD
    - F_D60_L3_ULS_BASIC_COMBINATION_DESIGN
    - F_D60_L3_ULS_ACCIDENTAL_COMBINATION
    - F_D60_L3_SLS_FREQUENT_COMBINATION
    - F_D60_L3_SLS_QUASI_PERMANENT_COMBINATION
  layer4_section_resistance_properties:
    description: 截面抗力与几何特性
    formulas: []
  layer5_limit_state_verification:
    description: 极限状态验算与合规判定
    formulas: []
formulas:
- id: F_D60_L1_ACTIVE_EARTH_PRESSURE_COEFFICIENT
  meta:
    name: 主动土压力系数
    layer: layer1_parameters_coefficients
    source: JTG D60-2015, 4.2.3, 式(4.2.3-5)
    applicability: 主动土压力计算
    related_rules:
    - R_D60_CH04_013
    related_variables:
    - VAR_D60_alpha
    - VAR_beta
    - VAR_delta
    - VAR_mu_active
    - VAR_D60_phi
  math:
    expression: mu = cos(phi - alpha)^2 / (cos(alpha)^2 * cos(alpha + delta) * (1 + sqrt(sin(phi + delta) * sin(phi - beta)
      / (cos(alpha + delta) * cos(alpha - beta))))^2)
    variables:
    - VAR_D60_phi
    - VAR_D60_alpha
    - VAR_delta
    - VAR_beta
    output: VAR_mu_active
    dependencies: []
  constraints:
    pre:
    - angle variables use degree
    post:
    - VAR_mu_active > 0
  execution:
    type: python
    logic: 'phi, alpha, delta, beta = map(radians, [VAR_D60_phi, VAR_D60_alpha, VAR_delta, VAR_beta])

      VAR_mu_active = cos(phi - alpha)**2 / (cos(alpha)**2 * cos(alpha + delta) * (1 + sqrt((sin(phi + delta) * sin(phi -
      beta)) / (cos(alpha + delta) * cos(alpha - beta))))**2)

      return VAR_mu_active

      '
  formula_status: normative
- id: F_D60_L1_BREAKING_FORCE_EQUIVALENT_WIDTH
  meta:
    name: 汽车制动力等效车道系数
    layer: layer1_parameters_coefficients
    source: JTG D60-2015, 4.3.5
    applicability: 多车道汽车荷载制动力标准值折算
    related_rules:
    - R_D60_CH04_021
    related_variables:
    - VAR_eta_brake
    - VAR_D60_lane_count
  math:
    expression: eta_brake = 1.0, 2.0, 2.34, or 2.68 by lane count
    variables:
    - VAR_D60_lane_count
    output: VAR_eta_brake
    dependencies: []
  constraints:
    pre:
    - VAR_D60_lane_count >= 1
    post:
    - VAR_eta_brake > 0
  execution:
    type: python
    logic: 'mapping = {1: 1.0, 2: 2.0, 3: 2.34, 4: 2.68}

      VAR_eta_brake = mapping.get(VAR_D60_lane_count)

      return VAR_eta_brake

      '
  formula_status: normative
- id: F_D60_L1_CENTRIFUGAL_FORCE_COEFFICIENT
  meta:
    name: 汽车荷载离心力系数
    layer: layer1_parameters_coefficients
    source: JTG D60-2015, 4.3.3, 式(4.3.3)
    applicability: 曲线桥汽车荷载离心力计算
    related_rules:
    - R_D60_CH04_019
    related_variables:
    - VAR_C
    - VAR_R
    - VAR_D60_v
  math:
    expression: C = v^2 / (127 * R)
    variables:
    - VAR_D60_v
    - VAR_R
    output: VAR_C
    dependencies: []
  constraints:
    pre:
    - VAR_D60_v >= 0
    - VAR_R > 0
    post:
    - VAR_C >= 0
  execution:
    type: python
    logic: 'VAR_C = VAR_D60_v**2 / (127 * VAR_R)

      return VAR_C

      '
  formula_status: normative
- id: F_D60_L1_EARTH_PRESSURE_COEFFICIENT_STATIC
  meta:
    name: 静止土压力系数
    layer: layer1_parameters_coefficients
    source: JTG D60-2015, 4.2.3, 式(4.2.3-2)
    applicability: 静止土压力计算
    related_rules:
    - R_D60_CH04_013
    related_variables:
    - VAR_D60_phi
    - VAR_xi
  math:
    expression: xi = 1 - sin(phi)
    variables:
    - VAR_D60_phi
    output: VAR_xi
    dependencies: []
  constraints:
    pre:
    - 0 <= VAR_D60_phi < 90
    post:
    - VAR_xi >= 0
  execution:
    type: python
    logic: 'phi = radians(VAR_D60_phi)

      VAR_xi = 1 - sin(phi)

      return VAR_xi

      '
  formula_status: normative
- id: F_D60_L1_LATERAL_PRESSURE_COEFFICIENT
  meta:
    name: 侧压系数
    layer: layer1_parameters_coefficients
    source: JTG D60-2015, 4.2.3, 式(4.2.3-13)
    applicability: 压实填土水平压力计算
    related_rules:
    - R_D60_CH04_013
    related_variables:
    - VAR_lambda
    - VAR_D60_phi
  math:
    expression: lambda = tan(45 - phi / 2)^2
    variables:
    - VAR_D60_phi
    output: VAR_lambda
    dependencies: []
  constraints:
    pre:
    - 0 <= VAR_D60_phi < 90
    post:
    - VAR_lambda >= 0
  execution:
    type: python
    logic: 'phi = radians(VAR_D60_phi)

      VAR_lambda = tan(radians(45) - phi / 2)**2

      return VAR_lambda

      '
  formula_status: normative
- id: F_D60_L1_NAVIGATION_CLEARANCE_CORRECTION
  meta:
    name: 墩（台）边缘净距几何修正
    layer: layer1_parameters_coefficients
    source: JTG D60-2015, 3.2.3, 式(3.2.3)
    applicability: 通航河流上的斜交桥
    related_rules:
    - R_D60_CH03_012
    related_variables:
    - VAR_D60_alpha
    - VAR_b
    - VAR_l
    - VAR_l_a
  math:
    expression: l_a = (l + b * sin(alpha)) / cos(alpha)
    variables:
    - VAR_l
    - VAR_b
    - VAR_D60_alpha
    output: VAR_l_a
    dependencies: []
  constraints:
    pre:
    - VAR_l > 0
    - VAR_b > 0
    - 0 <= VAR_D60_alpha < 90
    post:
    - VAR_l_a > 0
  execution:
    type: python
    logic: 'alpha = radians(VAR_D60_alpha)

      VAR_l_a = (VAR_l + VAR_b * sin(alpha)) / cos(alpha)

      return VAR_l_a

      '
  formula_status: normative
- id: F_D60_L1_PEDESTRIAN_LOAD_INTERPOLATION
  meta:
    name: 人群荷载标准值插值
    layer: layer1_parameters_coefficients
    source: JTG D60-2015, 4.3.6, 表4.3.6
    applicability: 50m < L0 < 150m 时人群荷载标准值
    related_rules:
    - R_D60_CH04_022
    related_variables:
    - VAR_D60_L_0
    - VAR_D60_q_p
  math:
    expression: q_p = 3.25 - 0.005 * L_0
    variables:
    - VAR_D60_L_0
    output: VAR_D60_q_p
    dependencies: []
  constraints:
    pre:
    - 50 < VAR_D60_L_0 < 150
    post:
    - VAR_D60_q_p > 0
  execution:
    type: python
    logic: 'VAR_D60_q_p = 3.25 - 0.005 * VAR_D60_L_0

      return VAR_D60_q_p

      '
  formula_status: derived
- id: F_D60_L1_RETAINING_WALL_DISTRIBUTION_LENGTH
  meta:
    name: 挡土墙计算长度
    layer: layer1_parameters_coefficients
    source: JTG D60-2015, 4.3.4, 式(4.3.4-2)
    applicability: 车辆荷载引起挡土墙土压力计算长度
    related_rules:
    - R_D60_CH04_020
    related_variables:
    - VAR_B
    - VAR_H
  math:
    expression: B = 13 + H * tan(30)
    variables:
    - VAR_H
    output: VAR_B
    dependencies: []
  constraints:
    pre:
    - VAR_H >= 0
    post:
    - VAR_B > 0
  execution:
    type: python
    logic: 'VAR_B = 13 + VAR_H * tan(radians(30))

      return VAR_B

      '
  formula_status: normative
- id: F_D60_L1_SOIL_PRESSURE_WIDTH_GROUP_PILE
  meta:
    name: 柱式墩台土压力计算宽度
    layer: layer1_parameters_coefficients
    source: JTG D60-2015, 4.2.3, 式(4.2.3-8)
    applicability: 当 l_i <= D 时，多柱式墩台土压力计算宽度
    related_rules:
    - R_D60_CH04_013
    related_variables:
    - VAR_D
    - VAR_b
    - VAR_D60_l_i
    - VAR_n
  math:
    expression: b = (n * D + sum(l_i)) / n
    variables:
    - VAR_n
    - VAR_D
    - VAR_D60_l_i
    output: VAR_b
    dependencies: []
  constraints:
    pre:
    - VAR_n > 0
    - VAR_D > 0
    - all(VAR_D60_l_i >= 0)
    post:
    - VAR_b > 0
  execution:
    type: python
    logic: 'VAR_b = (VAR_n * VAR_D + sum(VAR_D60_l_i)) / VAR_n

      return VAR_b

      '
  formula_status: normative
- id: F_D60_L1_SOIL_PRESSURE_WIDTH_LARGE_COLUMN
  meta:
    name: 大直径柱土压力计算宽度
    layer: layer1_parameters_coefficients
    source: JTG D60-2015, 4.2.3, 式(4.2.3-10)
    applicability: 当 D > 1.0m 时，单柱土压力计算宽度
    related_rules:
    - R_D60_CH04_013
    related_variables:
    - VAR_D
    - VAR_b
    - VAR_n
  math:
    expression: b = (n * (D + 1) - 1) / n
    variables:
    - VAR_D
    - VAR_n
    output: VAR_b
    dependencies: []
  constraints:
    pre:
    - VAR_D > 1.0
    - VAR_n > 0
    post:
    - VAR_b > 0
  execution:
    type: python
    logic: 'VAR_b = (VAR_n * (VAR_D + 1) - 1) / VAR_n

      return VAR_b

      '
  formula_status: normative
- id: F_D60_L1_SOIL_PRESSURE_WIDTH_SMALL_COLUMN
  meta:
    name: 小直径柱土压力计算宽度
    layer: layer1_parameters_coefficients
    source: JTG D60-2015, 4.2.3, 式(4.2.3-9)
    applicability: 当 D <= 1.0m 时，单柱土压力计算宽度
    related_rules:
    - R_D60_CH04_013
    related_variables:
    - VAR_D
    - VAR_b
    - VAR_n
  math:
    expression: b = D * (2n - 1) / n
    variables:
    - VAR_D
    - VAR_n
    output: VAR_b
    dependencies: []
  constraints:
    pre:
    - VAR_D > 0
    - VAR_D <= 1.0
    - VAR_n > 0
    post:
    - VAR_b > 0
  execution:
    type: python
    logic: 'VAR_b = VAR_D * (2 * VAR_n - 1) / VAR_n

      return VAR_b

      '
  formula_status: normative
- id: F_D60_L1_VEHICLE_CONCENTRATED_LOAD_INTERPOLATION
  meta:
    name: 车道荷载集中荷载标准值插值
    layer: layer1_parameters_coefficients
    source: JTG D60-2015, 4.3.1, 表4.3.1-2
    applicability: 公路-I级车道荷载集中荷载标准值，5m < L0 < 50m
    related_rules:
    - R_D60_CH04_017
    related_variables:
    - VAR_D60_L_0
    - VAR_D60_P_k
  math:
    expression: P_k = 2 * (L_0 + 130)
    variables:
    - VAR_D60_L_0
    output: VAR_D60_P_k
    dependencies: []
  constraints:
    pre:
    - 5 < VAR_D60_L_0 < 50
    post:
    - VAR_D60_P_k > 0
  execution:
    type: python
    logic: 'VAR_D60_P_k = 2 * (VAR_D60_L_0 + 130)

      return VAR_D60_P_k

      '
  formula_status: derived
- id: F_D60_L1_VEHICLE_IMPACT_COEFFICIENT
  meta:
    name: 汽车荷载冲击系数
    layer: layer1_parameters_coefficients
    source: JTG D60-2015, 4.3.2, 式(4.3.2)
    applicability: 汽车荷载冲击作用计算
    related_rules:
    - R_D60_CH04_018
    related_variables:
    - VAR_f
    - VAR_mu
  math:
    expression: mu = 0.05 if f < 1.5; mu = 0.1767 * ln(f) - 0.0157 if 1.5 <= f <= 14; mu = 0.45 if f > 14
    variables:
    - VAR_f
    output: VAR_mu
    dependencies: []
  constraints:
    pre:
    - VAR_f > 0
    post:
    - VAR_mu >= 0
  execution:
    type: python
    logic: "if VAR_f < 1.5:\n    VAR_mu = 0.05\nelif VAR_f <= 14:\n    VAR_mu = 0.1767 * log(VAR_f) - 0.0157\nelse:\n    VAR_mu\
      \ = 0.45\nreturn VAR_mu\n"
  formula_status: normative
- id: F_D60_L2_ACTIVE_EARTH_PRESSURE_NO_VEHICLE
  meta:
    name: 无汽车荷载时主动土压力标准值
    layer: layer2_standard_actions
    source: JTG D60-2015, 4.2.3, 式(4.2.3-4)
    applicability: 土层特性无变化且无汽车荷载作用时
    related_rules:
    - R_D60_CH04_013
    related_variables:
    - VAR_B
    - VAR_E
    - VAR_H
    - VAR_gamma
    - VAR_mu_active
  math:
    expression: E = 0.5 * B * mu * gamma * H^2
    variables:
    - VAR_B
    - VAR_mu_active
    - VAR_gamma
    - VAR_H
    output: VAR_E
    dependencies:
    - F_D60_L1_ACTIVE_EARTH_PRESSURE_COEFFICIENT
  constraints:
    pre:
    - VAR_B > 0
    - VAR_mu_active > 0
    - VAR_gamma > 0
    - VAR_H > 0
    post:
    - VAR_E > 0
  execution:
    type: python
    logic: 'VAR_E = 0.5 * VAR_B * VAR_mu_active * VAR_gamma * VAR_H**2

      return VAR_E

      '
  formula_status: normative
- id: F_D60_L2_ACTIVE_EARTH_PRESSURE_WITH_VEHICLE
  meta:
    name: 有汽车荷载时主动土压力标准值
    layer: layer2_standard_actions
    source: JTG D60-2015, 4.2.3, 式(4.2.3-6)
    applicability: 土层特性无变化但有汽车荷载作用，且 beta=0
    related_rules:
    - R_D60_CH04_013
    related_variables:
    - VAR_B
    - VAR_E
    - VAR_H
    - VAR_gamma
    - VAR_h
    - VAR_mu_active
  math:
    expression: E = 0.5 * B * mu * gamma * H * (H + 2h)
    variables:
    - VAR_B
    - VAR_mu_active
    - VAR_gamma
    - VAR_H
    - VAR_h
    output: VAR_E
    dependencies:
    - F_D60_L1_ACTIVE_EARTH_PRESSURE_COEFFICIENT
  constraints:
    pre:
    - VAR_B > 0
    - VAR_mu_active > 0
    - VAR_gamma > 0
    - VAR_H > 0
    - VAR_h >= 0
    post:
    - VAR_E > 0
  execution:
    type: python
    logic: 'VAR_E = 0.5 * VAR_B * VAR_mu_active * VAR_gamma * VAR_H * (VAR_H + 2 * VAR_h)

      return VAR_E

      '
  formula_status: normative
- id: F_D60_L2_CENTRIFUGAL_FORCE
  meta:
    name: 汽车荷载离心力标准值
    layer: layer2_standard_actions
    source: JTG D60-2015, 4.3.3
    applicability: 曲线桥车辆荷载离心力计算
    related_rules:
    - R_D60_CH04_019
    related_variables:
    - VAR_C
    - VAR_Q_centrifugal
    - VAR_Q_vehicle
  math:
    expression: Q_centrifugal = C * Q_vehicle
    variables:
    - VAR_C
    - VAR_Q_vehicle
    output: VAR_Q_centrifugal
    dependencies:
    - F_D60_L1_CENTRIFUGAL_FORCE_COEFFICIENT
  constraints:
    pre:
    - VAR_C >= 0
    - VAR_Q_vehicle >= 0
    post:
    - VAR_Q_centrifugal >= 0
  execution:
    type: python
    logic: 'VAR_Q_centrifugal = VAR_C * VAR_Q_vehicle

      return VAR_Q_centrifugal

      '
  formula_status: normative
- id: F_D60_L2_DRIFT_IMPACT_FORCE
  meta:
    name: 漂流物横桥向撞击力设计值
    layer: layer2_standard_actions
    source: JTG D60-2015, 4.4.2, 式(4.4.2)
    applicability: 有漂流物水域中的桥梁墩台
    related_rules:
    - R_D60_CH04_031
    related_variables:
    - VAR_F_drift
    - VAR_T
    - VAR_W
    - VAR_g
    - VAR_D60_v
  math:
    expression: F = W * v / (g * T)
    variables:
    - VAR_W
    - VAR_D60_v
    - VAR_g
    - VAR_T
    output: VAR_F_drift
    dependencies: []
  constraints:
    pre:
    - VAR_W > 0
    - VAR_D60_v >= 0
    - VAR_g > 0
    - VAR_T > 0
    post:
    - VAR_F_drift >= 0
  execution:
    type: python
    logic: 'VAR_F_drift = VAR_W * VAR_D60_v / (VAR_g * VAR_T)

      return VAR_F_drift'
  formula_status: normative
- id: F_D60_L2_EFFECTIVE_PRESTRESS
  meta:
    name: 有效预应力
    layer: layer2_standard_actions
    source: JTG D60-2015, 4.2.2, 式(4.2.2-2)
    applicability: 扣除相应阶段预应力损失后的有效预应力
    related_rules:
    - R_D60_CH04_012
    related_variables:
    - VAR_sigma_con
    - VAR_sigma_l
    - VAR_D60_sigma_pe
  math:
    expression: sigma_pe = sigma_con - sigma_l
    variables:
    - VAR_sigma_con
    - VAR_sigma_l
    output: VAR_D60_sigma_pe
    dependencies: []
  constraints:
    pre:
    - VAR_sigma_con >= 0
    - VAR_sigma_l >= 0
    post:
    - VAR_D60_sigma_pe >= 0
  execution:
    type: python
    logic: 'VAR_D60_sigma_pe = VAR_sigma_con - VAR_sigma_l

      return VAR_D60_sigma_pe

      '
  formula_status: normative
- id: F_D60_L2_FAILURE_ANGLE_ACTIVE_EARTH_PRESSURE
  meta:
    name: 破坏棱体破裂面夹角正切值
    layer: layer2_standard_actions
    source: JTG D60-2015, 4.2.3, 式(4.2.3-7)
    applicability: beta=0时主动土压力破裂面角度计算
    related_rules:
    - R_D60_CH04_013
    related_variables:
    - VAR_D60_alpha
    - VAR_omega
    - VAR_D60_phi
    - VAR_tan_theta
    - VAR_theta
  math:
    expression: tan(theta) = -tan(omega) + sqrt((cot(phi) + tan(omega)) * (tan(omega) - tan(alpha)))
    variables:
    - VAR_theta
    - VAR_omega
    - VAR_D60_phi
    - VAR_D60_alpha
    output: VAR_tan_theta
    dependencies: []
  constraints:
    pre:
    - angle variables use degree
    post:
    - VAR_tan_theta is not None
  execution:
    type: python
    logic: 'omega, phi, alpha = map(radians, [VAR_omega, VAR_D60_phi, VAR_D60_alpha])

      VAR_tan_theta = -tan(omega) + sqrt((1 / tan(phi) + tan(omega)) * (tan(omega) - tan(alpha)))

      return VAR_tan_theta

      '
  formula_status: normative
- id: F_D60_L2_FLOWING_WATER_PRESSURE
  meta:
    name: 流水压力标准值
    layer: layer2_standard_actions
    source: JTG D60-2015, 4.3.9, 式(4.3.9)
