notes:
- 变量库采用公式库中的VAR_*作为主键，保证规则库、表格库、公式库之间可互相索引。
- 若同一符号在不同公式中语义不同，当前版本优先保留工程通用含义；后续可拆分为更细变量ID。
- kN_or_effect、effect表示该变量既可为作用值，也可为作用效应值，具体类型由调用规则确定。
- 角度变量默认输入单位为deg，执行公式时按需要转换为rad。
