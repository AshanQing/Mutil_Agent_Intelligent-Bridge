- id: R_D60_CH04_004
  meta:
    name: 作用组合原则规则
    source: JTG D60-2015, 4.1.4条
    original_text: 摘要：作用组合应考虑结构上可能同时出现的作用，并按最不利效应组合。
    mandatory_level: 应
    rule_type: combination
    description: 作用组合应只考虑结构上可能同时出现的作用； 对结构或构件产生有利影响的可变作用不应参与不利组合； 实际不可能同时出现的作用不应组合； 多个偶然作用不应同时参与组合； 地震作用不应与偶然作用同时参与组合； 施工阶段作用组合应根据结构所处条件确定。
    related_refs:
      formulas: []
      tables:
      - T_D60_4_1_4_ACTION_SIMULTANEITY
      variables: []
      rules: []
