      - T_D60_4_3_5_BRAKING_FORCE_DISTRIBUTION
      variables:
      - VAR_eta_brake
      - VAR_D60_lane_count
      rules: []
  applicability:
    trigger_condition: 计算桥梁纵向水平力、支座水平力或墩台纵向力时
    stage:
