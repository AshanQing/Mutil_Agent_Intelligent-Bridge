metadata:
  library_type: rule_registry
  standard: JTG D60-2015
  standard_name: 公路桥涵设计通用规范
  version: reasonableness_fixed_v0.1
  description: 由 01总则、03设计要求、04作用 三个章节规则库合并生成的 D60 规则库。
  source_files:
  - 01总则.yaml
  - 03设计要求.yaml
  - 04作用.yaml
  source_rule_counts:
    01总则.yaml: 8
    03设计要求.yaml: 58
    04作用.yaml: 34
  total_rules: 100
  merge_policy:
    preserve_rule_content: true
    preserve_source_file: true
    duplicate_id_handling: 若出现重复ID，为后续重复项追加 __DUPn 后缀，并在 meta.alias_ids 中保留原ID。
    relation_policy: 本次只合并规则库，不创建新的表格、公式、变量对象；原 related_refs 保持不变。
  generation_note: 根据 JTG_D60_2015_reasonableness_review.md 修正：补充 formula_status，回写表格/公式/变量关联，对人工判断语义规则标记 hybrid/manual_review，保留需人工复核的泛化变量。
  cross_standard_consistency_audit:
    date: '2026-06-28'
    method: ID uniqueness, cross-library reference integrity, reciprocal relation completion, formula-variable linkage, variable
      symbol/unit semantic conflict scan
    safe_modification_policy: 仅补充可由现有ID关系直接推出的反向引用和公式变量关联；未擅自改名、删项或修正规范数值。
    duplicate_id_scope_fix: 跨规范重复变量ID已按所属规范添加标准域前缀，并同步更新本规范四库内全部引用。
rules:
- id: R_D60_CH01_001
  meta:
    name: 桥涵设计基本原则
    source: JTG D60-2015, 1.0.1条
    original_text: 为规范公路桥涵设计，按照安全、耐久、适用、环保、经济和美观的原则，制定本规范。
    mandatory_level: 应
    rule_type: principle
    description: 公路桥涵设计应从安全性、耐久性、适用性、环保性、经济性和美观性六个方面进行综合控制。
    related_refs:
      formulas: []
      tables: []
      variables: []
  applicability:
    trigger_condition: 进行公路桥涵设计、方案审查或验算结果评价时
    stage:
    - 总体设计
    - 方案比选
    - 结构验算
    - 结果审查
    object:
    - 公路桥梁
    - 公路涵洞
    - 桥梁上部结构
    - 桥梁下部结构
    - 基础结构
    - 附属结构
  logic:
    inputs:
    - design_scheme
    - check_results
    outputs:
    - design_principle_review
    expression: ''
  action:
    executable: false
    execution_logic: 该规则不直接参与数值计算。 在自动化验算报告中，将其作为总体审查维度； 若结构安全性、耐久性或适用性相关验算不满足，则总体设计原则审查不得通过。
    note: 原则性规则，主要用于报告审查、方案评价和设计结果总评。
  _source_file: 01总则.yaml
  _source_chapter: '01'
- id: R_D60_CH01_002
  meta:
    name: 规范适用范围规则
    source: JTG D60-2015, 1.0.2条
    original_text: 本规范适用于新建和改建各等级公路桥涵的设计。
    mandatory_level: 应
    rule_type: applicability
    description: 当工程类型为新建或改建，且对象属于各等级公路桥梁或公路涵洞时， JTG D60-2015可作为顶层设计规则和作用规则来源。
    related_refs:
      formulas: []
      tables: []
      variables: []
      rules: []
    review_flags:
    - formula_policy_without_internal_formula_ref
  applicability:
    trigger_condition: 建立桥梁或涵洞设计验算任务前
    stage:
    - 规则库初始化
    - 总体设计
    - 结构验算
    object:
    - 公路桥梁
    - 公路涵洞
  logic:
    inputs:
    - project_type
    - road_grade
    - structure_category
    outputs:
    - standard_applicability
    - applicable_standard
    expression: ''
  action:
    executable: true
    execution_logic: 判断 project_type 是否属于“新建”或“改建”； 判断 structure_category 是否属于“公路桥梁”或“公路涵洞”； 若均满足，则 standard_applicability
      = true， applicable_standard 中加入 JTG D60-2015。
    note: 该规则为规则库入口规则，用于判断后续D60规则是否可调用。 含“宜、可、必要时、应根据”等人工判断语义；自动化系统可生成审查项或触发任务，但不得仅凭本规则直接输出刚性合格/不合格结论。 审查报告提示该规则具有公式/查表策略但未能关联内部对象；本次未强行制造伪关联，调用端应按外部规范、上下文触发或人工复核处理。
    execution_mode: hybrid
    manual_review_required: true
  _source_file: 01总则.yaml
  _source_chapter: '01'
- id: R_D60_CH01_003
  meta:
    name: 设计基准期规则
    source: JTG D60-2015, 1.0.3条
    original_text: 公路桥涵结构的设计基准期为100年。
    mandatory_level: 应
    rule_type: parameter
    description: 对适用于本规范的公路桥涵结构，设计基准期统一取100年。
    related_refs:
      formulas: []
      tables: []
      variables: []
      rules: []
    review_flags:
    - formula_policy_without_internal_formula_ref
  applicability:
    trigger_condition: 初始化桥梁或涵洞设计验算任务时
    stage:
    - 总体设计
    - 结构验算
    - 作用取值
    - 作用组合
    object:
    - 公路桥梁
    - 公路涵洞
    - 桥梁构件
    - 涵洞构件
  logic:
    inputs:
    - standard_applicability
    outputs:
    - design_reference_period_years
    expression: ''
  action:
    executable: true
    execution_logic: 将 design_reference_period_years 赋值为 100。
    note: 直接赋值规则，不需要调用公式或表格。 审查报告提示该规则具有公式/查表策略但未能关联内部对象；本次未强行制造伪关联，调用端应按外部规范、上下文触发或人工复核处理。 补充 standard_applicability 作为前置输入，表示仅当
      D60 适用时才写入设计基准期。
    execution_mode: hybrid
    manual_review_required: true
  _source_file: 01总则.yaml
  _source_chapter: '01'
- id: R_D60_CH01_004
  meta:
    name: 设计使用年限规则
    source: JTG D60-2015, 1.0.4条
    original_text: 公路桥涵主体结构和可更换部件的设计使用年限不应低于表1.0.4的规定。
    mandatory_level: 不应低于
    rule_type: table_lookup
    description: 公路桥涵主体结构和可更换部件应根据公路等级、桥涵类别和构件类型确定设计使用年限； 实际采用的设计使用年限不得低于规范表1.0.4规定值。
    related_refs:
      formulas: []
      tables:
      - T_D60_1_0_4_DESIGN_WORKING_LIFE
      variables: []
      rules: []
  applicability:
    trigger_condition: 确定桥梁主体结构或可更换部件的设计使用年限时
    stage:
    - 总体设计
    - 耐久性设计
    - 构件设计
    - 结构验算
    object:
    - 公路桥梁
    - 公路涵洞
    - 主体结构
    - 可更换部件
    - 支座
    - 伸缩装置
    - 斜拉索
    - 吊索
    - 系杆
  logic:
    inputs:
    - road_grade
    - bridge_class
    - component_type
    - replaceable_component_flag
    outputs:
    - design_working_life_years
    expression: ''
  action:
    executable: true
    execution_logic: 调用表格 T_D60_1_0_4_DESIGN_WORKING_LIFE； 根据 road_grade、bridge_class、component_type 和 replaceable_component_flag
      查询规定设计使用年限； 输出 design_working_life_years。 若用户输入的设计使用年限小于表格规定值，则判定为不满足。
    note: 表1.0.4的具体年限数据应放入表格库，不在规则文件中展开。 含“宜、可、必要时、应根据”等人工判断语义；自动化系统可生成审查项或触发任务，但不得仅凭本规则直接输出刚性合格/不合格结论。
    execution_mode: hybrid
    manual_review_required: true
  _source_file: 01总则.yaml
  _source_chapter: '01'
- id: R_D60_CH01_005
  meta:
    name: 桥涵分类规则
    source: JTG D60-2015, 1.0.5条
    original_text: 特大、大、中、小桥及涵洞按单孔跨径或多孔跨径总长分类规定见表1.0.5。
    mandatory_level: 应
    rule_type: classification
    description: 桥梁或涵洞类别应根据多孔跨径总长和单孔跨径进行判定。 当按多孔跨径总长和单孔跨径得到的类别不一致时，应取较高类别作为最终分类结果。
    related_refs:
      formulas: []
      tables:
      - T_D60_1_0_5_BRIDGE_CLASSIFICATION
      variables: []
      rules: []
  applicability:
    trigger_condition: 需要确定桥梁或涵洞类别时
    stage:
    - 总体设计
    - 跨径布置
    - 水文设计
    - 结构验算
    object:
    - 桥梁
    - 涵洞
    - 整桥
  logic:
    inputs:
    - bridge_total_length
    - single_span_length
    outputs:
    - bridge_class
    expression: ''
  action:
    executable: true
    execution_logic: 调用表格 T_D60_1_0_5_BRIDGE_CLASSIFICATION； 分别根据 bridge_total_length 和 single_span_length 查询桥涵类别； 对两个分类结果进行等级比较，取较高类别作为
      bridge_class。
    note: 表1.0.5的分类阈值应放入表格库；该规则只描述查表逻辑和取高原则。 含“宜、可、必要时、应根据”等人工判断语义；自动化系统可生成审查项或触发任务，但不得仅凭本规则直接输出刚性合格/不合格结论。
    execution_mode: hybrid
    manual_review_required: true
  _source_file: 01总则.yaml
  _source_chapter: '01'
- id: R_D60_CH01_006
  meta:
    name: 减灾防灾设计规则
    source: JTG D60-2015, 1.0.6条
    original_text: 公路桥涵应进行抗风、抗震、抗撞等减灾防灾设计。
    mandatory_level: 应
    rule_type: trigger
    description: 公路桥涵设计应根据工程环境和结构特点考虑抗风、抗震、抗撞等减灾防灾设计要求。
    related_refs:
      formulas: []
      tables: []
      variables: []
      rules: []
    review_flags:
    - formula_policy_without_internal_formula_ref
  applicability:
    trigger_condition: 建立桥涵结构设计和验算任务树时
    stage:
    - 总体设计
    - 结构验算
    - 抗风设计
    - 抗震设计
    - 防撞设计
    object:
    - 公路桥梁
    - 公路涵洞
    - 桥梁上部结构
    - 桥梁下部结构
    - 基础结构
    - 防撞设施
    - 支座系统
  logic:
    inputs:
    - bridge_type
    - bridge_site_condition
    - wind_check_required
    - seismic_check_required
    - collision_check_required
    outputs:
    - disaster_prevention_check_tasks
    expression: ''
  action:
    executable: true
    execution_logic: 根据桥型、桥位环境、结构重要性及专项设计要求， 判断是否触发抗风验算、抗震验算、抗撞验算等任务； 将触发结果写入 disaster_prevention_check_tasks。
    note: 该规则只负责触发专项验算任务，具体抗风、抗震、抗撞计算应调用相应专项规范和公式库。 含“宜、可、必要时、应根据”等人工判断语义；自动化系统可生成审查项或触发任务，但不得仅凭本规则直接输出刚性合格/不合格结论。 审查报告提示该规则具有公式/查表策略但未能关联内部对象；本次未强行制造伪关联，调用端应按外部规范、上下文触发或人工复核处理。
    execution_mode: hybrid
    manual_review_required: true
  _source_file: 01总则.yaml
  _source_chapter: '01'
- id: R_D60_CH01_007
  meta:
    name: 环境保护与资源节约规则
    source: JTG D60-2015, 1.0.7条
    original_text: 公路桥涵设计应满足环境保护和资源节约的有关要求。
    mandatory_level: 应
    rule_type: principle
    description: 桥涵设计应考虑环境保护和资源节约要求，避免对周边环境造成不合理影响， 并优先采用资源消耗合理、环境适应性较好的设计方案。
    related_refs:
      formulas: []
      tables: []
      variables: []
  applicability:
    trigger_condition: 进行桥涵方案设计、材料选择、施工方案比选或设计结果审查时
    stage:
    - 总体设计
    - 方案比选
    - 材料选择
    - 施工组织
    - 设计审查
    object:
    - 公路桥梁
    - 公路涵洞
    - 桥梁结构体系
    - 桥梁构件
    - 施工方案
  logic:
    inputs:
    - design_scheme
    - material_scheme
    - construction_scheme
    - environmental_constraints
    outputs:
    - environmental_resource_review
    expression: ''
  action:
    executable: false
    execution_logic: 该规则不直接进行结构数值计算； 在方案审查中生成环境保护和资源节约审查项； 若工程存在特殊环保约束，应将相关约束传递给总体布置、材料选择和施工方案模块。
    note: 原则性审查规则，适合作为方案比选和设计报告评价项。
  _source_file: 01总则.yaml
  _source_chapter: '01'
- id: R_D60_CH01_008
  meta:
    name: 相关标准协调规则
    source: JTG D60-2015, 1.0.8条
    original_text: 公路桥涵设计除应符合本规范的规定外，尚应符合国家和行业现行有关标准的规定。
    mandatory_level: 应
    rule_type: applicability
    description: JTG D60-2015作为公路桥涵设计的通用规范，不能单独覆盖所有构件承载力和专项验算； 具体材料、构件、基础、抗震、施工等验算还应调用相应国家或行业现行标准。
    related_refs:
      formulas: []
      tables: []
      variables: []
      rules: []
    review_flags:
    - formula_policy_without_internal_formula_ref
  applicability:
    trigger_condition: 建立完整桥梁设计验算规则体系时
    stage:
    - 规则库初始化
    - 结构验算
    - 专项验算
    - 报告生成
    object:
    - 公路桥梁
    - 公路涵洞
    - 桥梁上部结构
    - 桥梁下部结构
    - 基础结构
    - 附属结构
  logic:
    inputs:
    - check_object
    - material_type
    - structure_type
    - check_task
    outputs:
    - required_standard_list
    - required_rule_library_list
    expression: ''
  action:
    executable: true
    execution_logic: 根据 check_object、material_type、structure_type 和 check_task， 判断是否需要调用混凝土桥规、钢结构桥规、地基基础规范、抗震规范、施工规范等外部规则库；
      输出 required_standard_list 和 required_rule_library_list。
    note: 该规则用于建立多规范协同调用机制，避免将D60误用为全部验算依据。 审查报告提示该规则具有公式/查表策略但未能关联内部对象；本次未强行制造伪关联，调用端应按外部规范、上下文触发或人工复核处理。
    execution_mode: hybrid
    manual_review_required: true
  _source_file: 01总则.yaml
  _source_chapter: '01'
- id: R_D60_CH03_001
  meta:
    name: 桥涵总体设计原则
    source: JTG D60-2015, 3.1.1条
    original_text: 摘要：桥涵应根据公路功能、技术等级、施工养护等因素进行总体设计，并满足设计使用年限内正常交通荷载通行需求。
    mandatory_level: 应
    rule_type: principle
    description: 桥涵总体设计应综合考虑公路功能、技术等级、因地制宜、就地取材、施工养护便利性， 并保证设计使用年限内正常交通荷载通行需求。
    related_refs:
      formulas: []
      tables: []
      variables: []
  applicability:
    trigger_condition: 进行桥涵总体设计或方案初始化时
    stage:
    - 总体设计
    - 方案比选
    object:
    - 公路桥梁
    - 公路涵洞
    - 整桥
  logic:
    inputs:
    - road_function
    - technical_grade
    - construction_condition
    - maintenance_condition
    - design_traffic_load
    outputs:
    - general_design_requirement
    expression: ''
  action:
    executable: false
    execution_logic: 生成总体设计审查项；若设计方案不能满足交通功能、施工养护或正常荷载通行要求， 则标记为总体设计不满足。
    note: 原则性规则，主要用于总体方案审查。
  _source_file: 03设计要求.yaml
  _source_chapter: '03'
- id: R_D60_CH03_002
  meta:
    name: 桥涵线形设计规则
    source: JTG D60-2015, 3.1.2条
    original_text: 摘要：桥涵线形设计应符合路线总体要求，特大桥和大桥应综合考虑路线、地质、地形、通行、通航、环境等因素。
    mandatory_level: 应
    rule_type: principle
    description: 中小桥涵线形应服从路线总体设计；特大桥、大桥线形设计应综合考虑路线走向、 桥区地质地形、安全通行、通航、既有设施和环境敏感区等因素。
    related_refs:
      formulas: []
      tables: []
      variables: []
  applicability:
    trigger_condition: 进行桥位、桥轴线或纵横断面线形设计时
    stage:
    - 总体设计
    - 路线协调
    - 桥位设计
    object:
    - 公路桥梁
    - 中小桥
    - 特大桥
    - 大桥
  logic:
    inputs:
    - bridge_class
    - route_alignment
    - geology_condition
    - terrain_condition
    - traffic_safety_requirement
    - navigation_requirement
    - environmental_sensitive_area
    outputs:
    - alignment_design_review
    expression: ''
  action:
    executable: false
    execution_logic: 根据桥梁类别生成线形设计审查项；对特大桥和大桥，应额外检查桥位环境、 通航通行和环境敏感因素。
    note: 原则性规则，后续可结合路线几何数据进行半自动审查。
  _source_file: 03设计要求.yaml
  _source_chapter: '03'
- id: R_D60_CH03_003
  meta:
    name: 极限状态设计规则
    source: JTG D60-2015, 3.1.3条
    original_text: 摘要：桥涵结构应按承载能力极限状态和正常使用极限状态设计。
    mandatory_level: 应
    rule_type: trigger
    description: 桥涵结构验算应划分为承载能力极限状态和正常使用极限状态。
    related_refs:
      formulas: []
      tables: []
      variables: []
      rules: []
    review_flags:
    - formula_policy_without_internal_formula_ref
  applicability:
    trigger_condition: 建立结构验算任务树时
    stage:
    - 结构验算
    object:
    - 桥梁结构
