- id: R_D60_CH04_019
  meta:
    name: 汽车荷载离心力计算规则
    source: JTG D60-2015, 4.3.3条
    original_text: 摘要：曲线桥应计算汽车荷载引起的离心力，离心力标准值由车辆荷载标准值乘以离心力系数确定。
