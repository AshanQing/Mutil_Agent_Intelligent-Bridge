    note: 属于偶然作用，主要用于桥墩和临路构件防撞验算。 含“宜、可、必要时、应根据”等人工判断语义；自动化系统可生成审查项或触发任务，但不得仅凭本规则直接输出刚性合格/不合格结论。 审查报告提示该规则具有公式/查表策略但未能关联内部对象；本次未强行制造伪关联，调用端应按外部规范、上下文触发或人工复核处理。
