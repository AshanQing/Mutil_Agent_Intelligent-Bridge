    source: JTG D60-2015, 4.1.1条
    original_text: 摘要：公路桥涵设计采用的作用分为永久作用、可变作用、偶然作用和地震作用四类。
    mandatory_level: 应
    rule_type: classification
    description: 桥涵设计作用应划分为永久作用、可变作用、偶然作用和地震作用。 结构重力、预加力、土重及土侧压力、混凝土收缩徐变、水浮力、基础变位等属于永久作用； 汽车荷载、人群荷载、风荷载、温度作用、制动力、离心力、流水压力、冰压力等属于可变作用；
      船舶撞击、漂流物撞击、汽车撞击等属于偶然作用； 地震作用单独归类。
    related_refs:
      formulas: []
      tables:
      - T_D60_4_1_1_ACTION_CLASSIFICATION
      variables: []
      rules: []
    review_flags:
    - formula_policy_without_internal_formula_ref
  applicability:
    trigger_condition: 进行桥涵作用建模、作用取值或作用组合前
    stage:
    - 作用建模
    - 结构验算
    - 荷载组合
    object:
    - 公路桥梁
    - 公路涵洞
    - 上部结构
    - 下部结构
    - 基础结构
    - 附属结构
  logic:
    inputs:
    - action_name
    - action_source
    - action_duration
    - action_variability
    outputs:
    - action_category
    expression: ''
  action:
    executable: true
    execution_logic: 根据 action_name 和 action_source 识别作用类别； 输出 action_category，供代表值选择、作用组合和验算任务调用。
    note: 作用分类是后续作用代表值和作用组合的前置规则。 含“宜、可、必要时、应根据”等人工判断语义；自动化系统可生成审查项或触发任务，但不得仅凭本规则直接输出刚性合格/不合格结论。 审查报告提示该规则具有公式/查表策略但未能关联内部对象；本次未强行制造伪关联，调用端应按外部规范、上下文触发或人工复核处理。
