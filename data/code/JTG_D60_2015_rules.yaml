    related_refs:
      formulas:
      - F_D60_L1_CENTRIFUGAL_FORCE_COEFFICIENT
      - F_D60_L2_CENTRIFUGAL_FORCE
      tables:
      - T_D60_4_3_1_5_TRANSVERSE_LANE_FACTOR
      variables:
      - VAR_C
      - VAR_Q_centrifugal
      - VAR_Q_vehicle
      - VAR_R
      - VAR_D60_v
      rules: []
  applicability:
    trigger_condition: 桥梁位于平曲线上或需要考虑车辆离心作用时
    stage:
    - 可变作用计算
    - 横向力计算
    object:
    - 曲线桥
    - 弯桥
    - 桥墩
    - 支座
    - 上部结构
  logic:
    inputs:
    - design_speed
    - curve_radius
    - vehicle_load_standard_value
    - lane_reduction_factor
    outputs:
    - centrifugal_force_factor
    - centrifugal_force_standard_value
    expression: ''
  action:
    executable: true
    execution_logic: 根据 design_speed 和 curve_radius 计算离心力系数； 乘以车辆荷载标准值及横向车道布载系数得到离心力标准值。
    note: 与制动力同时组合时应联动4.1.5的70%折减规则。 含“宜、可、必要时、应根据”等人工判断语义；自动化系统可生成审查项或触发任务，但不得仅凭本规则直接输出刚性合格/不合格结论。
    execution_mode: hybrid
    manual_review_required: true
