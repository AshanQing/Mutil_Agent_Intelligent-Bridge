      - VAR_S_ud
      - VAR_gamma_0
      - VAR_gamma_Gi
      - VAR_gamma_L1
      - VAR_gamma_Lj
      - VAR_gamma_Q1
      - VAR_gamma_Qj
      - VAR_psi_c
      - VAR_psi_f1
      - VAR_psi_qj
      rules: []
  applicability:
