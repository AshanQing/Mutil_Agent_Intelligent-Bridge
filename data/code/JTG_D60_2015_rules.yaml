    execution_logic: 根据结构类型判断是否计入冲击力； 若计入，则根据 structural_frequency 调用冲击系数公式； 计算 vehicle_impact_effect。
    note: 结构基频可由经验公式、模型分析或有限元分析获得。 含“宜、可、必要时、应根据”等人工判断语义；自动化系统可生成审查项或触发任务，但不得仅凭本规则直接输出刚性合格/不合格结论。 审查报告提示该规则具有公式/查表策略但未能关联内部对象；本次未强行制造伪关联，调用端应按外部规范、上下文触发或人工复核处理。
