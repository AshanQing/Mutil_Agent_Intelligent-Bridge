- id: R_D60_CH04_015
  meta:
    name: 水浮力计算规则
    source: JTG D60-2015, 4.2.5条
    original_text: 摘要：桥梁墩台和基础应根据地基透水性、设计水位和结构排水体积考虑水浮力。
    mandatory_level: 应
    rule_type: calculation
    description: 基础位于透水性地基上时，稳定验算应考虑设计水位浮力； 基础嵌入不透水地基时可不考虑水浮力； 不确定地基透水性时，应按透水和不透水两种情况组合，取不利者。 水浮力标准值可按水重度和排水体积计算。
    related_refs:
      formulas:
      - F_D60_L2_WATER_BUOYANCY
      tables: []
      variables:
      - VAR_F_buoyancy
      - VAR_V_w
      - VAR_gamma_water
      rules: []
    review_flags:
    - table_policy_without_internal_table_ref
  applicability:
    trigger_condition: 进行墩台、承台、基础稳定或承载验算时
    stage:
    - 永久作用计算
    - 稳定验算
    - 基础验算
    object:
    - 桥墩
    - 桥台
    - 承台
    - 桩基础
    - 扩大基础
  logic:
    inputs:
    - foundation_soil_permeability
    - design_water_level
    - displaced_water_volume
    - foundation_embedment_condition
    outputs:
    - buoyancy_standard_value
    expression: ''
  action:
    executable: true
    execution_logic: 根据地基透水性确定是否考虑水浮力； 若需要计算，则调用浮力公式 F = gamma_w * V_displaced。
    note: 用于基础稳定、抗浮和承载验算。 含“宜、可、必要时、应根据”等人工判断语义；自动化系统可生成审查项或触发任务，但不得仅凭本规则直接输出刚性合格/不合格结论。 审查报告提示该规则具有公式/查表策略但未能关联内部对象；本次未强行制造伪关联，调用端应按外部规范、上下文触发或人工复核处理。
