- id: R_D60_CH04_017
  meta:
    name: 汽车荷载计算规则
    source: JTG D60-2015, 4.3.1条
    original_text: 摘要：汽车荷载分为公路-I级和公路-II级，包括车道荷载和车辆荷载，并应考虑横向布载系数、纵向折减等。
    mandatory_level: 应
    rule_type: calculation
    description: 汽车荷载分为公路-I级和公路-II级； 车道荷载由均布荷载和集中荷载组成； 车辆荷载按规定轴载和平面布置采用； 横桥向多车道布载时应考虑横向车道布载系数； 大跨径桥梁应考虑纵向折减。
    related_refs:
      formulas:
      - F_D60_L1_VEHICLE_CONCENTRATED_LOAD_INTERPOLATION
      tables:
      - T_D60_4_3_1_1_HIGHWAY_LOAD_GRADE
      - T_D60_4_3_1_2_CONCENTRATED_LOAD
      - T_D60_4_3_1_3_VEHICLE_LOAD_DIMENSION
      - T_D60_4_3_1_4_DESIGN_LANE_NUMBER
      - T_D60_4_3_1_5_TRANSVERSE_LANE_FACTOR
      - T_D60_4_3_1_6_LONGITUDINAL_REDUCTION_FACTOR
      variables:
      - VAR_D60_L_0
      - VAR_D60_P_k
      rules: []
  applicability:
    trigger_condition: 进行桥涵车辆荷载建模或活载效应计算时
    stage:
    - 可变作用计算
    - 活载计算
    - 结构验算
    object:
    - 桥梁
    - 涵洞
    - 上部结构
    - 下部结构
    - 桥面系
  logic:
    inputs:
    - highway_load_grade
    - calculation_span
    - bridge_width
    - lane_number
    - influence_line
    - bridge_structure_type
    outputs:
    - lane_load_model
    - vehicle_load_model
    - vehicle_load_effect
    expression: ''
  action:
    executable: true
    execution_logic: 根据 highway_load_grade 生成车道荷载和车辆荷载； 根据 bridge_width 查设计车道数； 根据车道数调用横向布载系数； 当 calculation_span 超过纵向折减阈值时调用纵向折减系数；
      结合影响线计算最不利车辆荷载效应。
    note: 该规则是桥梁自动化验算中车辆活载建模的核心规则。 含“宜、可、必要时、应根据”等人工判断语义；自动化系统可生成审查项或触发任务，但不得仅凭本规则直接输出刚性合格/不合格结论。
    execution_mode: hybrid
    manual_review_required: true
  _source_file: 04作用.yaml
  _source_chapter: '04'
- id: R_D60_CH04_018
  meta:
    name: 汽车荷载冲击力计算规则
    source: JTG D60-2015, 4.3.2条
    original_text: 摘要：汽车荷载冲击力标准值为汽车荷载标准值乘以冲击系数，冲击系数按结构基频确定。
    mandatory_level: 应
