- id: T_D60_3_4_3_MIN_UNDERBRIDGE_CLEARANCE
  meta:
    name: 非通航河流桥下最小净空表
    source: JTG D60-2015, 表3.4.3
    description: 用于非通航河流桥梁桥下净空控制。
    related_rules:
    - R_D60_CH03_027
  schema:
    inputs:
    - bridge_part
    - debris_condition
    - water_level_type
    outputs:
    - min_underbridge_clearance_m
  constraints:
    matching_method: exact
    interpolation: none
    out_of_bounds: error
  data:
  - bridge_part: 梁底
    hydraulic_condition: 洪水期无大漂流物
    water_level_type: 高出计算水位
    min_underbridge_clearance_m: 0.5
  - bridge_part: 梁底
    hydraulic_condition: 洪水期无大漂流物
    water_level_type: 高出最高流冰水面
    min_underbridge_clearance_m: 0.75
  - bridge_part: 梁底
    hydraulic_condition: 洪水期有大漂流物
    water_level_type: 高出计算水位
    min_underbridge_clearance_m: 1.5
  - bridge_part: 梁底
    hydraulic_condition: 洪水期有大漂流物
    water_level_type: 高出最高流冰水面
    min_underbridge_clearance_m: null
    status: not_specified
  - bridge_part: 梁底
    hydraulic_condition: 有泥石流
    water_level_type: 高出计算水位
    min_underbridge_clearance_m: 1.0
  - bridge_part: 梁底
    hydraulic_condition: 有泥石流
    water_level_type: 高出最高流冰水面
    min_underbridge_clearance_m: null
    status: not_specified
  - bridge_part: 支承垫石顶面
    hydraulic_condition: 通用
    water_level_type: 高出计算水位
    min_underbridge_clearance_m: 0.25
  - bridge_part: 支承垫石顶面
    hydraulic_condition: 通用
    water_level_type: 高出最高流冰水面
    min_underbridge_clearance_m: 0.5
  - bridge_part: 有铰拱拱脚
    hydraulic_condition: 通用
    water_level_type: 高出计算水位
    min_underbridge_clearance_m: 0.25
  - bridge_part: 有铰拱拱脚
    hydraulic_condition: 通用
    water_level_type: 高出最高流冰水面
    min_underbridge_clearance_m: 0.25
- id: T_D60_3_4_4_CULVERT_FREEBOARD
  meta:
    name: 无压力式涵洞净高表
    source: JTG D60-2015, 表3.4.4
    description: 用于无压力式涵洞内顶点至设计洪水位之间净高控制。
    related_rules:
    - R_D60_CH03_028
    remarks: ' data 行中补充 min_freeboard_m 字段，并保留原 min_freeboard_requirement 结构。'
  schema:
    inputs:
    - culvert_type
    - inlet_height
    - design_water_level
    outputs:
    - min_freeboard_m
  constraints:
    matching_method: range
    interpolation: none
    out_of_bounds: error
  data:
  - culvert_type: 管涵
    inlet_clear_height_condition: h <= 3
    min_freeboard_requirement:
      expression: h / 4
      comparison: '>='
      unit: m
    min_freeboard_m:
      expression: h / 4
      comparison: '>='
      unit: m
  - culvert_type: 拱涵
    inlet_clear_height_condition: h <= 3
    min_freeboard_requirement:
      expression: h / 4
      comparison: '>='
      unit: m
    min_freeboard_m:
      expression: h / 4
      comparison: '>='
      unit: m
  - culvert_type: 矩形涵
    inlet_clear_height_condition: h <= 3
    min_freeboard_requirement:
      expression: h / 6
      comparison: '>='
      unit: m
    min_freeboard_m:
      expression: h / 6
      comparison: '>='
      unit: m
  - culvert_type: 管涵
    inlet_clear_height_condition: h > 3
    min_freeboard_requirement:
      value: 0.75
      comparison: '>='
      unit: m
    min_freeboard_m:
      value: 0.75
      comparison: '>='
      unit: m
  - culvert_type: 拱涵
    inlet_clear_height_condition: h > 3
    min_freeboard_requirement:
      value: 0.75
      comparison: '>='
      unit: m
    min_freeboard_m:
      value: 0.75
      comparison: '>='
      unit: m
  - culvert_type: 矩形涵
    inlet_clear_height_condition: h > 3
    min_freeboard_requirement:
      value: 0.5
      comparison: '>='
      unit: m
    min_freeboard_m:
      value: 0.5
      comparison: '>='
      unit: m
- id: T_D60_3_7_3_ASPHALT_PAVEMENT_THICKNESS
  meta:
    name: 沥青混凝土桥面铺装厚度表
    source: JTG D60-2015, 3.7.3条
    description: "用于不同公路等级桥梁沥青混凝土桥面铺装厚度控制。\n 高速公路和一级公路桥梁不宜小于70mm；\n二级及以下公路桥梁不宜小于50mm。"
    related_rules:
    - R_D60_CH03_048
  schema:
    inputs:
    - road_grade
    - pavement_type
    outputs:
    - min_pavement_thickness_mm
  constraints:
    matching_method: exact
    interpolation: none
    out_of_bounds: error
  data:
  - road_grade: 高速公路
    pavement_type: 沥青混凝土桥面铺装
    min_pavement_thickness_mm: 70
  - road_grade: 一级公路
    pavement_type: 沥青混凝土桥面铺装
    min_pavement_thickness_mm: 70
  - road_grade: 二级公路
    pavement_type: 沥青混凝土桥面铺装
    min_pavement_thickness_mm: 50
  - road_grade: 三级公路
    pavement_type: 沥青混凝土桥面铺装
    min_pavement_thickness_mm: 50
  - road_grade: 四级公路
    pavement_type: 沥青混凝土桥面铺装
    min_pavement_thickness_mm: 50
- id: T_D60_3_7_4_CONCRETE_PAVEMENT_REQUIREMENT
  meta:
    name: 水泥混凝土桥面铺装构造要求表
    source: JTG D60-2015, 3.7.4条
    description: 本条用于水泥混凝土桥面铺装构造合规性检查。 铺装面层厚度不包含整平层和垫层； 混凝土强度等级不应低于C40； 铺装层内应配置钢筋焊网，钢筋直径不宜小于8mm，间距不宜大于100mm。
    related_rules:
    - R_D60_CH03_049
    remarks: ' data 行中补充 steel_mesh_requirement 字段，与 schema.outputs 保持一致。'
  schema:
    inputs:
    - pavement_type
    - road_grade
    outputs:
    - min_pavement_thickness_m
    - min_concrete_strength_grade
    - steel_mesh_requirement
  constraints:
    matching_method: exact
    interpolation: none
    out_of_bounds: error
  data:
  - pavement_type: 水泥混凝土桥面铺装
    min_pavement_thickness_mm: 80
    min_pavement_thickness_m: 0.08
    pavement_thickness_excluded_layers:
    - 整平层
    - 垫层
    min_concrete_strength_grade: C40
    steel_mesh_required: true
    min_steel_mesh_diameter_mm: 8
    max_steel_mesh_spacing_mm: 100
    steel_mesh_requirement: 应设置钢筋网；钢筋直径不宜小于8mm，间距不宜大于100mm。
