  - calculation_span_condition: 600 <= L0 < 800
    longitudinal_reduction_factor: 0.95
  - calculation_span_condition: 800 <= L0 < 1000
    longitudinal_reduction_factor: 0.94
  - calculation_span_condition: L0 >= 1000
