- id: T_D60_1_0_4_DESIGN_WORKING_LIFE
  meta:
    name: 桥涵设计使用年限表
    source: JTG D60-2015, 表1.0.4
    description: 根据公路等级、桥涵类别和构件类型查询设计使用年限。 主体结构和可更换部件应分开查询。
    remarks: 表中“高速公路、一级公路”为同一组取值； “二级公路、三级公路”为同一组取值； 四级公路单独列出，但其主体结构取值与二级、三级公路相同。
    related_rules:
    - R_D60_CH01_004
  schema:
    inputs:
    - road_grade
    - bridge_class
    - component_type
    - replaceable_component_flag
    outputs:
    - design_working_life_years
  constraints:
    matching_method: exact
    interpolation: none
    out_of_bounds: error
  data:
