  meta:
    name: 冰温系数表
    source: JTG D60-2015, 表4.3.11-2
    description: 根据冰温查询冰温系数Ct。 表列冰温系数可直线内插。 当冰温为0℃时，Ct取1.0； 当冰温为-10℃及以下时，Ct取2.0； 当冰温介于0℃与-10℃之间时，可按线性插值计算。
    related_rules:
    - R_D60_CH04_027
  schema:
    inputs:
    - ice_temperature_C
    outputs:
    - ice_temperature_factor_Ct
  constraints:
    matching_method: range
    interpolation: linear
    out_of_bounds: error
  data:
  - ice_temperature_condition: T = 0
    ice_temperature_factor_Ct: 1.0
  - ice_temperature_condition: T <= -10
    ice_temperature_factor_Ct: 2.0
