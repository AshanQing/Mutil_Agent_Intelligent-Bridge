  - climate_zone: 寒冷地区
    bridge_type: 混凝土、石桥
    material_type: 混凝土、石
    maximum_effective_temperature_C: 34
    minimum_effective_temperature_C: -10
    minimum_effective_temperature_special_region_C: null
  - climate_zone: 温热地区
    bridge_type: 钢桥
    material_type: 钢桥面板
    maximum_effective_temperature_C: 46
    minimum_effective_temperature_C: -9
    minimum_effective_temperature_special_region_C: -3
  - climate_zone: 温热地区
    bridge_type: 钢桥
    material_type: 混凝土桥面板
    maximum_effective_temperature_C: 39
    minimum_effective_temperature_C: -6
    minimum_effective_temperature_special_region_C: -1
  - climate_zone: 温热地区
    bridge_type: 混凝土、石桥
    material_type: 混凝土、石
    maximum_effective_temperature_C: 34
    minimum_effective_temperature_C: -3
    minimum_effective_temperature_special_region_C: 0
- id: T_D60_4_3_12_3_VERTICAL_TEMPERATURE_BASE
  meta:
    name: 竖向温度梯度基数表
    source: JTG D60-2015, 表4.3.12-3
    description: 根据结构类型、桥面铺装类型和铺装厚度查询竖向日照正温差计算所需的温度基数T1、T2。 当采用沥青混凝土铺装时，应区分50mm和100mm铺装厚度。 若实际铺装厚度介于表列厚度之间，可由执行引擎设置线性插值或进入人工复核。
    related_rules:
    - R_D60_CH04_028
    remarks: ' 已补充 pavement_thickness_min_mm / pavement_thickness_max_mm / pavement_thickness_range_mm，明确 range 匹配边界。'
  schema:
    inputs:
    - structure_type
    - pavement_type
    - pavement_thickness
    outputs:
    - T1_C
    - T2_C
  constraints:
    matching_method: range
    interpolation: linear
    out_of_bounds: error
    range_field: pavement_thickness_mm
    range_note: 沥青混凝土铺装厚度在50mm与100mm之间时，T1_C、T2_C按线性插值取值；水泥混凝土铺装按固定值匹配。
  data:
  - structure_type: 通用桥梁结构
    pavement_type: 水泥混凝土铺装
    pavement_thickness: null
    T1_C: 25
    T2_C: 6.7
    pavement_thickness_min_mm: null
    pavement_thickness_max_mm: null
    pavement_thickness_range_mm: not_applicable
  - structure_type: 通用桥梁结构
    pavement_type: 沥青混凝土铺装
    pavement_thickness: 50mm
    pavement_thickness_mm: 50
    T1_C: 20
    T2_C: 6.7
    pavement_thickness_min_mm: 50
    pavement_thickness_max_mm: 100
    pavement_thickness_range_mm: 50 <= pavement_thickness_mm <= 100
  - structure_type: 通用桥梁结构
    pavement_type: 沥青混凝土铺装
    pavement_thickness: 100mm
    pavement_thickness_mm: 100
    T1_C: 14
    T2_C: 5.5
    pavement_thickness_min_mm: 50
    pavement_thickness_max_mm: 100
    pavement_thickness_range_mm: 50 <= pavement_thickness_mm <= 100
- id: T_D60_4_3_13_BEARING_FRICTION_COEFFICIENT
  meta:
    name: 支座摩擦系数表
    source: JTG D60-2015, 表4.3.13
    description: 根据支座种类、接触面条件、润滑条件和温度条件查询支座摩擦系数μ。 对板式橡胶支座、盆式支座、球型支座等，表中部分取值与是否采用5201硅脂润滑剂、 支座适用温度范围有关。执行引擎应优先匹配更具体的条件。
    related_rules:
    - R_D60_CH04_009
    - R_D60_CH04_029
  schema:
    inputs:
    - bearing_type
    - contact_condition
    - lubricant_condition
    - temperature_condition
    outputs:
    - bearing_friction_coefficient_mu
  constraints:
    matching_method: condition
    interpolation: none
    out_of_bounds: error
  data:
  - bearing_type: 滚动支座
    contact_condition: 滚动接触
    lubricant_condition: 通用
    temperature_condition: 通用
    bearing_friction_coefficient_mu: 0.05
  - bearing_type: 板式橡胶支座
    contact_condition: 支座与混凝土面接触
    lubricant_condition: 通用
    temperature_condition: 通用
    bearing_friction_coefficient_mu: 0.3
  - bearing_type: 板式橡胶支座
    contact_condition: 支座与钢板接触
    lubricant_condition: 通用
    temperature_condition: 通用
    bearing_friction_coefficient_mu: 0.2
  - bearing_type: 板式橡胶支座
    contact_condition: 聚四氟乙烯板与不锈钢板接触
    lubricant_condition: 加5201硅脂润滑剂
    temperature_condition: 支座适用温度为-25℃时
    bearing_friction_coefficient_mu: 0.06
    adjusted_value:
      condition: 温度低于-25℃时
      bearing_friction_coefficient_mu: 0.078
  - bearing_type: 板式橡胶支座
    contact_condition: 聚四氟乙烯板与不锈钢板接触
    lubricant_condition: 不加5201硅脂润滑剂
    temperature_condition: 支座适用温度为-25℃时
    bearing_friction_coefficient_mu: 0.12
    adjusted_value:
      condition: 温度低于-25℃时
      bearing_friction_coefficient_mu: 0.156
  - bearing_type: 盆式支座
    contact_condition: 聚四氟乙烯板与不锈钢板接触
    lubricant_condition: 加5201硅脂润滑剂
    temperature_condition: 支座适用温度为-25℃~+60℃时
    bearing_friction_coefficient_mu: 0.03
    limit_type: 不大于
  - bearing_type: 盆式支座
    contact_condition: 聚四氟乙烯板与不锈钢板接触
    lubricant_condition: 加5201硅脂润滑剂
    temperature_condition: 支座适用温度为-40℃~+60℃时
    bearing_friction_coefficient_mu: 0.06
    limit_type: 不大于
  - bearing_type: 球型支座
    contact_condition: 聚四氟乙烯板与不锈钢板接触
    lubricant_condition: 加5201硅脂润滑剂
    temperature_condition: 支座适用温度为-25℃~+60℃时
    bearing_friction_coefficient_mu: 0.03
    limit_type: 不大于
  - bearing_type: 球型支座
    contact_condition: 聚四氟乙烯板与不锈钢板接触
    lubricant_condition: 加5201硅脂润滑剂
    temperature_condition: 支座适用温度为-40℃~+60℃时
    bearing_friction_coefficient_mu: 0.05
    limit_type: 不大于
- id: T_D60_4_3_1_1_HIGHWAY_LOAD_GRADE
  meta:
    name: 公路汽车荷载等级表
    source: JTG D60-2015, 表4.3.1-1
    description: 用于根据公路等级确定汽车荷载等级。
    remarks: 本表用于车辆荷载建模前的荷载等级识别。 执行引擎应根据 road_grade 自动返回 highway_load_grade， 并进一步调用车道荷载、车辆荷载、设计车道数及横向布载系数等表格。
    related_rules:
    - R_D60_CH04_017
  schema:
    inputs:
    - road_grade
    outputs:
    - highway_load_grade
  constraints:
    matching_method: exact
    interpolation: none
    out_of_bounds: error
  data:
  - road_grade: 高速公路
    highway_load_grade: 公路-I级
  - road_grade: 一级公路
    highway_load_grade: 公路-I级
  - road_grade: 二级公路
    highway_load_grade: 公路-II级
  - road_grade: 三级公路
    highway_load_grade: 公路-II级
  - road_grade: 四级公路
    highway_load_grade: 公路-II级
- id: T_D60_4_3_1_2_CONCENTRATED_LOAD
  meta:
    name: 车道荷载集中荷载标准值表
    source: JTG D60-2015, 表4.3.1-2
    description: 用于车道荷载集中荷载Pk取值。       根据计算跨径L0确定集中荷载Pk。 当L0位于5m和50m之间时，按表达式Pk = 2 * (L0 + 130)计算。 表中L0为计算跨径，单位为m；Pk单位为kN。
    related_rules:
    - R_D60_CH04_017
  schema:
    inputs:
    - calculation_span_L0_m
    outputs:
    - concentrated_load_Pk_kN
  constraints:
    matching_method: range
    interpolation: none
    out_of_bounds: error
  data:
  - calculation_span_condition: L0 <= 5
    concentrated_load_Pk_kN:
      value: 270
      unit: kN
  - calculation_span_condition: 5 < L0 < 50
    concentrated_load_Pk_kN:
      expression: 2 * (L0 + 130)
      unit: kN
  - calculation_span_condition: L0 >= 50
    concentrated_load_Pk_kN:
      value: 360
      unit: kN
- id: T_D60_4_3_1_3_VEHICLE_LOAD_DIMENSION
  meta:
    name: 车辆荷载主要技术指标表
    source: JTG D60-2015, 4.3.1条
    description: 公路-I级和公路-II级汽车荷载采用相同的车辆荷载标准值。 本表用于车辆荷载模型建立，包括车辆总重、轴重、轴距、轮距、 车轮着地尺寸和车辆外形尺寸。
    remarks: 本表用于车辆荷载布置和局部效应计算。 图4.3.1-2给出了车辆荷载的立面和平面布置； 尺寸单位为m，荷载单位为kN。 车辆荷载用于桥梁结构整体或局部验算时，应按最不利位置布置。
    related_rules:
    - R_D60_CH04_017
  schema:
    inputs:
    - vehicle_load_grade
    outputs:
    - vehicle_total_weight_kN
    - axle_loads_kN
    - axle_spacing_m
    - wheel_spacing_m
    - wheel_contact_size_m
    - vehicle_dimension_m
  constraints:
    matching_method: exact
    interpolation: none
    out_of_bounds: error
  data:
  - vehicle_load_grade:
    - 公路-I级
    - 公路-II级
    vehicle_total_weight_kN: 550
    axle_loads_kN:
      front_axle:
        axle_count: 1
        load_per_axle_kN: 30
        total_load_kN: 30
      middle_axles:
        axle_count: 2
        load_per_axle_kN: 120
        total_load_kN: 240
      rear_axles:
        axle_count: 2
        load_per_axle_kN: 140
        total_load_kN: 280
    axle_spacing_m:
      expression: 3 + 1.4 + 7 + 1.4
      values:
      - 3.0
      - 1.4
      - 7.0
      - 1.4
      total_vehicle_axle_layout_length_m: 12.8
    wheel_spacing_m: 1.8
    wheel_contact_size_m:
      front_wheel:
        width_m: 0.3
        length_m: 0.2
        expression: 0.3 × 0.2
      middle_and_rear_wheel:
        width_m: 0.6
        length_m: 0.2
        expression: 0.6 × 0.2
    vehicle_dimension_m:
      length_m: 15.0
      width_m: 2.5
      expression: 15 × 2.5
- id: T_D60_4_3_1_4_DESIGN_LANE_NUMBER
  meta:
    name: 设计车道数表
    source: JTG D60-2015, 表4.3.1-4
    description: 根据桥面宽度W和车辆行驶方向类型确定桥涵设计车道数。 traffic_direction_type 可取 single_direction 或 two_direction。 当为单向行驶时，按单向行驶宽度区间查取；
      当为双向行驶时，按双向行驶宽度区间查取。 W为桥面宽度，单位为m。
    related_rules:
    - R_D60_CH04_017
  schema:
    inputs:
    - traffic_direction_type
    - bridge_deck_width_W_m
    outputs:
    - design_lane_number
  constraints:
    matching_method: range
    interpolation: none
    out_of_bounds: error
  data:
  - traffic_direction_type: single_direction
    traffic_direction_type_cn: 车辆单向行驶
    bridge_deck_width_condition: W < 7.0
    design_lane_number: 1
  - traffic_direction_type: single_direction
    traffic_direction_type_cn: 车辆单向行驶
    bridge_deck_width_condition: 7.0 <= W < 10.5
    design_lane_number: 2
  - traffic_direction_type: single_direction
    traffic_direction_type_cn: 车辆单向行驶
    bridge_deck_width_condition: 10.5 <= W < 14.0
    design_lane_number: 3
  - traffic_direction_type: single_direction
    traffic_direction_type_cn: 车辆单向行驶
    bridge_deck_width_condition: 14.0 <= W < 17.5
    design_lane_number: 4
  - traffic_direction_type: single_direction
    traffic_direction_type_cn: 车辆单向行驶
    bridge_deck_width_condition: 17.5 <= W < 21.0
    design_lane_number: 5
  - traffic_direction_type: single_direction
    traffic_direction_type_cn: 车辆单向行驶
    bridge_deck_width_condition: 21.0 <= W < 24.5
    design_lane_number: 6
  - traffic_direction_type: single_direction
    traffic_direction_type_cn: 车辆单向行驶
    bridge_deck_width_condition: 24.5 <= W < 28.0
    design_lane_number: 7
  - traffic_direction_type: single_direction
    traffic_direction_type_cn: 车辆单向行驶
    bridge_deck_width_condition: 28.0 <= W < 31.5
    design_lane_number: 8
  - traffic_direction_type: two_direction
    traffic_direction_type_cn: 车辆双向行驶
    bridge_deck_width_condition: 6.0 <= W < 14.0
    design_lane_number: 2
  - traffic_direction_type: two_direction
    traffic_direction_type_cn: 车辆双向行驶
    bridge_deck_width_condition: 14.0 <= W < 21.0
    design_lane_number: 4
  - traffic_direction_type: two_direction
    traffic_direction_type_cn: 车辆双向行驶
    bridge_deck_width_condition: 21.0 <= W < 28.0
    design_lane_number: 6
  - traffic_direction_type: two_direction
    traffic_direction_type_cn: 车辆双向行驶
    bridge_deck_width_condition: 28.0 <= W < 35.0
    design_lane_number: 8
- id: T_D60_4_3_1_5_TRANSVERSE_LANE_FACTOR
  meta:
    name: 横向车道布载系数表
    source: JTG D60-2015, 表4.3.1-5
    description: 用于多车道横向同时布载时汽车荷载效应折减。
