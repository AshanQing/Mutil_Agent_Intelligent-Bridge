- id: T_D60_3_3_6_STANDARD_SPAN_LIST
  meta:
    name: 桥涵标准化跨径表
    source: JTG D60-2015, 3.3.6条
    description: 当桥涵跨径在50m及以下时，宜采用标准化跨径。 输入 span_length_m 后，判断其是否属于 standard_span_list_m。 若属于，则 is_standard_span = true；否则为
      false，并可输出邻近标准跨径建议。
    remarks: 本条为条文列举型参数表，并非原规范表格。 适用于桥涵跨径50m及以下时的标准化跨径判断。 条文同时提出，采用标准化跨径的桥涵宜采用装配式结构及机械化、工厂化施工。 已将标准跨径列表改写为逐行记录结构，便于自动查表按 schema.outputs
      读取。
    related_rules:
    - R_D60_CH03_024
  schema:
    inputs:
    - span_length_m
    outputs:
    - is_standard_span
    - standard_span_list_m
  constraints:
    matching_method: exact
    interpolation: none
    out_of_bounds: error
  data:
  - span_length_m: 0.75
    standard_span_list_m: 0.75
    is_standard_span: true
  - span_length_m: 1.0
    standard_span_list_m: 1.0
    is_standard_span: true
  - span_length_m: 1.25
    standard_span_list_m: 1.25
    is_standard_span: true
  - span_length_m: 1.5
    standard_span_list_m: 1.5
    is_standard_span: true
  - span_length_m: 2.0
