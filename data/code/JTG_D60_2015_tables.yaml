- id: T_D60_4_1_5_1_STRUCTURE_SAFETY_LEVEL
  meta:
    name: 桥梁结构设计安全等级表
    source: JTG D60-2015, 表4.1.5-1
    description: 根据公路等级、桥涵类别及交通重要性确定公路桥涵结构设计安全等级。 对多跨不等跨桥梁，应按其中最大单孔跨径确定桥梁类别。 若同一结构同时满足多个安全等级条件，应取较高安全等级。
    remarks: 本表用于承载能力极限状态作用组合及结构重要性相关规则的前置分类。 表中列举的特大桥、大桥、中桥等桥梁类别应按表1.0.5中的单孔跨径确定； 对多跨不等跨桥梁，以其中最大跨径为准。 执行引擎应优先匹配高等级安全等级，即当同一对象满足多个条件时，取priority_level较高者。
    related_rules:
    - R_D60_CH04_005
  schema:
    inputs:
    - bridge_class
    - component_importance
    outputs:
    - design_safety_level
    - failure_consequence
  constraints:
    matching_method: condition
    interpolation: none
    out_of_bounds: error
  data:
  - design_safety_level: 一级
    priority_level: 1.1
    failure_consequence: 很严重
    applicable_conditions:
    - condition_id: L1_01
      object_type: 桥梁
      road_grade: 各等级公路
      bridge_class:
      - 特大桥
      - 大桥
      - 中桥
      description: 各等级公路上的特大桥、大桥、中桥
    - condition_id: L1_02
      object_type: 小桥
      road_grade:
      - 高速公路
      - 一级公路
      - 二级公路
      - 国防公路
      - 城市附近交通繁忙公路
      bridge_class:
      - 小桥
      description: 高速公路、一级公路、二级公路、国防公路及城市附近交通繁忙公路上的小桥
  - design_safety_level: 二级
    priority_level: 1.0
    failure_consequence: 严重
    applicable_conditions:
    - condition_id: L2_01
      object_type: 小桥
      road_grade:
      - 三级公路
      - 四级公路
      bridge_class:
      - 小桥
      description: 三、四级公路上的小桥
    - condition_id: L2_02
      object_type: 涵洞
      road_grade:
      - 高速公路
      - 一级公路
      - 二级公路
      - 国防公路
      - 城市附近交通繁忙公路
      bridge_class:
      - 涵洞
      description: 高速公路、一级公路、二级公路、国防公路及城市附近交通繁忙公路上的涵洞
  - design_safety_level: 三级
    priority_level: 0.9
    failure_consequence: 不严重
    applicable_conditions:
    - condition_id: L3_01
      object_type: 涵洞
      road_grade:
      - 三级公路
      - 四级公路
      bridge_class:
      - 涵洞
      description: 三、四级公路上的涵洞
- id: T_D60_4_1_5_2_PERMANENT_ACTION_PARTIAL_FACTOR
  meta:
    name: 永久作用分项系数表
    source: JTG D60-2015, 表4.1.5-2
    description: 根据永久作用类别、结构类型以及该作用对结构承载能力是否有利， 查询永久作用分项系数。 effect_direction 取值包括 unfavorable 和 favorable。 对结构承载能力不利时，采用不利分项系数；
      对结构承载能力有利时，采用有利分项系数。
    related_rules:
    - R_D60_CH04_003
    - R_D60_CH04_005
  schema:
    inputs:
    - action_category
    - action_name
    - structure_type
    - effect_direction
    outputs:
    - partial_factor
  constraints:
    matching_method: condition
    interpolation: none
    out_of_bounds: error
  data:
  - serial_no: 1
    action_category: permanent_action
    action_name: 混凝土和圬工结构重力
    description: 包括结构附加重力
    structure_type:
    - 混凝土结构
    - 圬工结构
    partial_factor:
      unfavorable: 1.2
      favorable: 1.0
  - serial_no: 1
    action_category: permanent_action
    action_name: 钢结构重力
    description: 包括结构附加重力
    structure_type:
    - 钢结构
    partial_factor:
      unfavorable:
        default: 1.1
        conditional_values:
        - condition: 采用钢桥面板
          value: 1.1
        - condition: 采用混凝土桥面板
          value: 1.2
      favorable: 1.0
  - serial_no: 2
    action_category: permanent_action
    action_name: 预加力
    structure_type:
    - 预应力混凝土结构
    - 预应力构件
    partial_factor:
      unfavorable: 1.2
      favorable: 1.0
  - serial_no: 3
    action_category: permanent_action
    action_name: 土的重力
    structure_type:
    - 桥台
    - 挡土结构
    - 涵洞
    - 基础结构
    partial_factor:
      unfavorable: 1.2
      favorable: 1.0
  - serial_no: 4
    action_category: permanent_action
    action_name: 混凝土的收缩及徐变作用
    structure_type:
    - 混凝土结构
    - 预应力混凝土结构
    - 钢混组合结构
    partial_factor:
      unfavorable: 1.0
      favorable: 1.0
  - serial_no: 5
    action_category: permanent_action
    action_name: 土侧压力
    structure_type:
    - 桥台
    - 挡土结构
    - 涵洞
    - 基础结构
    partial_factor:
      unfavorable: 1.4
      favorable: 1.0
  - serial_no: 6
    action_category: permanent_action
    action_name: 水的浮力
    structure_type:
    - 桥墩
    - 桥台
    - 承台
    - 基础结构
    partial_factor:
      unfavorable: 1.0
      favorable: 1.0
  - serial_no: 7
    action_category: permanent_action
    action_name: 基础变位作用
    structure_type:
    - 混凝土结构
    - 圬工结构
    partial_factor:
      unfavorable: 0.5
      favorable: 0.5
  - serial_no: 7
    action_category: permanent_action
    action_name: 基础变位作用
    structure_type:
    - 钢结构
    partial_factor:
      unfavorable: 1.0
      favorable: 1.0
