- id: T_D60_4_3_5_BRAKING_FORCE_DISTRIBUTION
  meta:
    name: 制动力分配规则表
    source: JTG D60-2015, 表4.3.5
    description: 根据桥梁结构体系、支座布置及支座类型确定刚性墩台上传递的制动力。 T1、T2、T3分别代表不同加载长度范围对应的制动力。 若同一墩台承受相邻两跨支座传递的制动力，应按注释要求组合相邻跨传来的制动力。
    related_rules:
    - R_D60_CH04_021
  schema:
    inputs:
    - bridge_type
    - bearing_arrangement
    - bearing_type
    outputs:
    - transmitted_braking_force
    - braking_force_symbol
  constraints:
    matching_method: exact
    interpolation: none
    out_of_bounds: error
  data:
  - bridge_type: 简支梁桥台
    bearing_arrangement: 固定支座
    bearing_type: 固定支座
    transmitted_braking_force:
      expression: T1
    braking_force_symbol: T1
  - bridge_type: 简支梁桥台
    bearing_arrangement: 聚四氟乙烯板支座
    bearing_type: 聚四氟乙烯板支座
    transmitted_braking_force:
      expression: 0.30 * T1
    braking_force_symbol: T1
  - bridge_type: 简支梁桥台
    bearing_arrangement: 滚动或摆动支座
    bearing_type: 滚动或摆动支座
    transmitted_braking_force:
      expression: 0.25 * T1
    braking_force_symbol: T1
  - bridge_type: 简支梁桥墩
    bearing_arrangement: 一个固定支座、一个活动支座
    bearing_type: 组合支座
    transmitted_braking_force:
      expression: 按注释计算
    braking_force_symbol: null
    note: '固定支座按T4计算，活动支座按0.30T5或0.25T5计算， 墩顶应承受活动支座传递的单跨跨径制动力， 桥墩承受的制动力为上注固定支座与活动支座传递的制动力之和。

      '
  - bridge_type: 简支梁桥墩
    bearing_arrangement: 两个固定支座
    bearing_type: 固定支座
    transmitted_braking_force:
      expression: 0.30 * T2
    braking_force_symbol: T2
  - bridge_type: 简支梁桥墩
    bearing_arrangement: 两个聚四氟乙烯板支座
    bearing_type: 聚四氟乙烯板支座
    transmitted_braking_force:
      expression: 0.25 * T2
    braking_force_symbol: T2
  - bridge_type: 简支梁桥墩
    bearing_arrangement: 两个滚动或摆动支座
    bearing_type: 滚动或摆动支座
    transmitted_braking_force:
      expression: 0.25 * T2
    braking_force_symbol: T2
  - bridge_type: 连续梁桥墩
    bearing_arrangement: 固定支座
    bearing_type: 固定支座
    transmitted_braking_force:
      expression: T3
    braking_force_symbol: T3
  - bridge_type: 连续梁桥墩
    bearing_arrangement: 聚四氟乙烯板支座
    bearing_type: 聚四氟乙烯板支座
    transmitted_braking_force:
      expression: 0.30 * T3
    braking_force_symbol: T3
  - bridge_type: 连续梁桥墩
    bearing_arrangement: 滚动或摆动支座
    bearing_type: 滚动或摆动支座
    transmitted_braking_force:
      expression: 0.25 * T3
    braking_force_symbol: T3
- id: T_D60_4_3_6_CROWD_LOAD
  meta:
    name: 人群荷载标准值表
    source: JTG D60-2015, 表4.3.6
    description: 根据计算跨径L0查询普通公路桥梁人群荷载标准值。 当50m < L0 < 150m时，按表达式3.25 - 0.005L0计算。 对非机动车、行人密集的公路桥梁，人群荷载标准值应取表列标准值的1.15倍。 对专用人行桥梁，人群荷载标准值取3.5kN/m²。
    related_rules:
    - R_D60_CH04_022
  schema:
    inputs:
    - calculation_span_L0_m
    - bridge_usage_type
    - crowd_density_condition
    outputs:
    - crowd_load_standard_value_kN_m2
  constraints:
    matching_method: range
    interpolation: none
    out_of_bounds: error
  data:
  - bridge_usage_type: 普通公路桥梁
    crowd_density_condition: 一般
    calculation_span_condition: L0 <= 50
    crowd_load_standard_value_kN_m2:
      value: 3.0
      unit: kN/m2
  - bridge_usage_type: 普通公路桥梁
    crowd_density_condition: 一般
    calculation_span_condition: 50 < L0 < 150
    crowd_load_standard_value_kN_m2:
      expression: 3.25 - 0.005 * L0
      unit: kN/m2
  - bridge_usage_type: 普通公路桥梁
    crowd_density_condition: 一般
    calculation_span_condition: L0 >= 150
    crowd_load_standard_value_kN_m2:
      value: 2.5
      unit: kN/m2
  - bridge_usage_type: 普通公路桥梁
    crowd_density_condition: 非机动车与行人密集
    calculation_span_condition: L0 <= 50
    crowd_load_standard_value_kN_m2:
      expression: 1.15 * 3.0
      unit: kN/m2
  - bridge_usage_type: 普通公路桥梁
    crowd_density_condition: 非机动车与行人密集
    calculation_span_condition: 50 < L0 < 150
    crowd_load_standard_value_kN_m2:
      expression: 1.15 * (3.25 - 0.005 * L0)
      unit: kN/m2
  - bridge_usage_type: 普通公路桥梁
    crowd_density_condition: 非机动车与行人密集
    calculation_span_condition: L0 >= 150
    crowd_load_standard_value_kN_m2:
      expression: 1.15 * 2.5
      unit: kN/m2
  - bridge_usage_type: 专用人行桥梁
    crowd_density_condition: 通用
    calculation_span_condition: all
    crowd_load_standard_value_kN_m2:
      value: 3.5
      unit: kN/m2
- id: T_D60_4_3_7_FATIGUE_LOAD_MODEL
  meta:
    name: 汽车疲劳荷载模型表
    source: JTG D60-2015, 4.3.7条
    description: 根据疲劳验算对象和构件连接是否满足疲劳荷载计算模型I的要求， 选择疲劳荷载计算模型I、模型II或模型III。 模型I为等效车道荷载模型； 模型II为双车模型； 模型III为单车模型。 当构件和连接不满足模型I验算要求时，应按模型II验算。
      桥面系构件的疲劳验算应采用模型III。
    related_rules:
    - R_D60_CH04_023
    remarks: ' data 行中补充 fatigue_load_model、axle_loads_kN、axle_spacing_m、lane_load_factor 顶层字段，与 schema.outputs 保持一致。'
  schema:
    inputs:
    - fatigue_load_model_type
    - component_type
    outputs:
    - fatigue_load_model
    - axle_loads_kN
    - axle_spacing_m
    - lane_load_factor
    - applicable_condition
  constraints:
    matching_method: condition
    interpolation: none
    out_of_bounds: error
  data:
  - fatigue_load_model_type: 模型I
    model_name: 等效车道荷载疲劳模型
    applicable_condition: '一般桥梁结构疲劳验算采用模型I。

      '
    load_form: 等效车道荷载
    lane_load:
      concentrated_load:
        expression: 0.7 * Pk
        base_variable: Pk
        description: 集中荷载标准值Pk按第4.3.1条相关规定取值
      uniform_load:
        components:
        - expression: 0.3 * qk
          base_variable: qk
        - expression: qk
          base_variable: qk
        description: 均布荷载标准值qk按第4.3.1条相关规定取值
    multi_lane_effect:
      consider_multiple_lanes: true
      transverse_lane_factor_table: T_D60_4_3_1_5_TRANSVERSE_LANE_FACTOR
    related_tables:
    - T_D60_4_3_1_2_CONCENTRATED_LOAD
    - T_D60_4_3_1_5_TRANSVERSE_LANE_FACTOR
    remarks: '模型I采用等效车道荷载。 集中荷载取0.7Pk，均布荷载按0.3qk和qk取值。 应考虑多车道影响，横向车道布载系数按表4.3.1-5采用。

      '
    fatigue_load_model: 等效车道荷载疲劳模型
    axle_loads_kN: []
    axle_spacing_m: []
    lane_load_factor: 按 T_D60_4_3_1_5_TRANSVERSE_LANE_FACTOR 查取
  - fatigue_load_model_type: 模型II
    model_name: 双车疲劳荷载模型
    applicable_condition: '当构件和连接不满足疲劳荷载计算模型I验算要求时，应按模型II验算。

      '
    load_form: 双车模型
    vehicle_count: 2
    vehicle_center_spacing_requirement:
      condition: center_spacing >= 40
      unit: m
      description: 计算加载时，两辆模型车的中心距离不得小于40m
    axle_layout:
      note: '两辆模型车轴距与轴重相同。 以下为单辆模型车的轴重和轴距布置。

        '
      single_vehicle:
        axle_loads_kN:
        - 40
        - 60
        - 105
        - 80
        - 80
        - 80
        axle_spacing_m:
        - 2.0
        - 2.5
        - 7.0
        - 1.4
        - 1.4
        total_axle_layout_length_m: 14.3
    figure_reference: 图4.3.7-1
    remarks: '图4.3.7-1给出了模型II的轴重和轴距布置。 图中尺寸单位为m，荷载单位为kN。 两辆模型车轴距与轴重相同，加载时两车中心距离不得小于40m。

      '
    fatigue_load_model: 双车疲劳荷载模型
    axle_loads_kN:
    - 40
    - 60
    - 105
    - 80
    - 80
    - 80
    axle_spacing_m:
    - 2.0
    - 2.5
    - 7.0
    - 1.4
    - 1.4
    lane_load_factor: null
  - fatigue_load_model_type: 模型III
    model_name: 单车疲劳荷载模型
    applicable_condition: '桥面系构件的疲劳验算应采用模型III。

      '
    load_form: 单车模型
    vehicle_count: 1
    axle_layout:
      note: '模型III为单车模型，图4.3.7-2给出了其立面和平面布置。 图中尺寸单位为m，荷载单位为kN。

        '
      axle_loads_kN:
      - 120
      - 120
      - 120
      - 120
      axle_spacing_m:
      - 1.2
      - 6.0
      - 1.2
      total_axle_layout_length_m: 8.4
    wheel_layout:
      transverse_wheel_spacing_m: 2.0
      wheel_contact_size_m:
        width_m: 0.2
        length_m: 0.6
        expression: 0.2 × 0.6
    figure_reference: 图4.3.7-2
    fatigue_load_model: 单车疲劳荷载模型
    axle_loads_kN:
    - 120
    - 120
    - 120
    - 120
    axle_spacing_m:
    - 1.2
    - 6.0
    - 1.2
    lane_load_factor: null
- id: T_D60_4_3_9_PIER_SHAPE_FACTOR
  meta:
    name: 桥墩形状系数表
    source: JTG D60-2015, 表4.3.9
    description: 根据桥墩迎水面或平面形状查询桥墩形状系数K。 该系数用于流水压力标准值计算。
    related_rules:
    - R_D60_CH04_025
  schema:
    inputs:
    - pier_shape
    outputs:
    - pier_shape_factor_K
  constraints:
    matching_method: exact
    interpolation: none
    out_of_bounds: error
  data:
  - pier_shape: 方形桥墩
    pier_shape_factor_K: 1.5
  - pier_shape: 矩形桥墩
    description: 长边与水流平行
    pier_shape_factor_K: 1.3
  - pier_shape: 圆形桥墩
    pier_shape_factor_K: 0.8
  - pier_shape: 尖端形桥墩
    pier_shape_factor_K: 0.7
  - pier_shape: 圆端形桥墩
    pier_shape_factor_K: 0.6
