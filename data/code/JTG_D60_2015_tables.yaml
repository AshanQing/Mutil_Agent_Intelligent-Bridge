- id: T_D60_1_0_5_BRIDGE_CLASSIFICATION
  meta:
    name: 桥梁涵洞分类表
    source: JTG D60-2015, 表1.0.5
    description: 分别按多孔跨径总长和单孔跨径查询类别； 当两者对应类别不一致时，取较高类别。
    related_rules:
    - R_D60_CH01_005
    - R_D60_CH03_023
  schema:
    inputs:
    - bridge_total_length
    - single_span_length
    outputs:
    - bridge_class
  constraints:
    matching_method: range
    interpolation: none
    out_of_bounds: error
  data:
  - bridge_class: 特大桥
    bridge_total_length_condition: L > 1000
    single_span_length_condition: Lk > 150
  - bridge_class: 大桥
    bridge_total_length_condition: 100 <= L <= 1000
    single_span_length_condition: 40 <= Lk <= 150
  - bridge_class: 中桥
    bridge_total_length_condition: 30 < L < 100
    single_span_length_condition: 20 <= Lk < 40
  - bridge_class: 小桥
    bridge_total_length_condition: 8 <= L <= 30
    single_span_length_condition: 5 <= Lk < 20
  - bridge_class: 涵洞
    bridge_total_length_condition: L < 8
    single_span_length_condition: Lk < 5
- id: T_D60_3_2_9_DESIGN_FLOOD_FREQUENCY
  meta:
    name: 桥涵设计洪水频率表
    source: JTG D60-2015, 表3.2.9
    description: 根据公路等级、桥涵类别和特殊结构类型查询设计洪水频率。 漫水桥、过水路面等应按特殊条文另行处理。
    remarks: 表中设计洪水频率以“1/n”形式存储，表示n年一遇设计洪水频率。 四级公路涵洞及小型排水构造物为“不作规定”，执行引擎应将其识别为非数值型结果， 后续可进入人工确认或地方标准补充判断。
    related_rules:
    - R_D60_CH03_018
  schema:
    inputs:
    - road_grade
    - bridge_class
    outputs:
    - design_flood_frequency
  constraints:
    matching_method: exact
    interpolation: none
    out_of_bounds: error
