  - loaded_lane_number: 3
    transverse_lane_factor: 0.78
  - loaded_lane_number: 4
    transverse_lane_factor: 0.67
  - loaded_lane_number: 5
    transverse_lane_factor: 0.6
  - loaded_lane_number: 6
    transverse_lane_factor: 0.55
  - loaded_lane_number: 7
    transverse_lane_factor: 0.52
  - loaded_lane_number: 8
    transverse_lane_factor: 0.5
- id: T_D60_4_3_1_6_LONGITUDINAL_REDUCTION_FACTOR
  meta:
    name: 汽车荷载纵向折减系数表
    source: JTG D60-2015, 表4.3.1-6
    description: 用于大跨径或长加载长度下汽车荷载纵向折减。
    related_rules:
    - R_D60_CH04_017
    - R_D60_CH04_021
  schema:
    inputs:
    - calculation_span_L0_m
    outputs:
    - longitudinal_reduction_factor
