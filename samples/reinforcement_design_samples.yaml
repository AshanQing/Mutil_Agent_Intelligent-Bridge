                  y_ref: top_cover
                  y_offset: "dia * 3"

                right_bend_point:
                  x_expr: "pier_centerline_x + 300"
                  y_ref: top_cover
                  y_offset: "dia * 3"

              branch_rules:
                left_branch:
                  start_from: left_bend_point
                  direction: left_down
