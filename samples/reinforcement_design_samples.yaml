      cap_height_mid: 1.6
      cap_height_end: 0.85
      cantilever_length: 1.2
      cap_slope: -0.05

    墩柱几何信息:
      column_count: 2
      column_diameter: 1.4
      column_spacing: 6.9
      column_tie_beam:
