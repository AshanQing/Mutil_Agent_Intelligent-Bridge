                  direction: horizontal
                  y_ref: top_cover
                  y_offset: "dia * 1"

                right_branch:
                  step_1:
                    start_from: right_bend_point
                    direction: right_down
                    until:
                      y_ref: bottom_cover
                      y_offset: "dia * 2"
                  step_2:
                    direction: horizontal
                    end_at: cap_centerline_x
                    y_ref: bottom_cover
                    y_offset: "dia * 2"

          # N6
          - id: N6
            category: 弯起钢筋
            subtype: 多段弯起
            dia: 28
            mirror: longitudinal
            z_pattern: pattern_1

            control_definition:
              reference_axis: pier_centerline_x
              bend_angle: 45

              key_points:
                left_bend_point:
                  x_expr: "pier_centerline_x - (300 + 800)"
                  y_ref: top_cover
                  y_offset: "dia * 2"

                right_bend_point:
                  x_expr: "pier_centerline_x + (300 + 750)"
                  y_ref: top_cover
                  y_offset: "dia * 2"

              branch_rules:
                left_branch:
                  start_from: left_bend_point
                  direction: left_down
                  until:
                    y_ref: bottom_cover
                    y_offset: "dia * 1"

                middle_branch:
                  start_from: left_bend_point
                  end_at: right_bend_point
                  direction: horizontal
                  y_ref: top_cover
                  y_offset: "dia * 2"

                right_branch:
                  step_1:
                    start_from: right_bend_point
                    direction: right_down
                    until:
                      y_ref: bottom_cover
                      y_offset: "dia * 3"

          # N7
          - id: N7
            category: 弯起钢筋
            subtype: 多段弯起
            dia: 28
            mirror: longitudinal
            z_pattern: pattern_1

            control_definition:
              reference_axis: pier_centerline_x
              bend_angle: 45

              key_points:
                left_bend_point:
                  x_expr: "pier_centerline_x - 300"
                  y_ref: top_cover
                  y_offset: "dia * 1"

                right_bend_point:
                  x_expr: "pier_centerline_x + 300"
                  y_ref: top_cover
                  y_offset: "dia * 1"

              branch_rules:
                left_branch:
                  start_from: left_bend_point
                  direction: left_down
                  until:
                    y_ref: bottom_cover
                    y_offset: "dia * 1"

                middle_branch:
                  start_from: left_bend_point
                  end_at: right_bend_point
                  direction: horizontal
                  y_ref: top_cover
                  y_offset: "dia * 1"

                right_branch:
                  step_1:
                    start_from: right_bend_point
                    direction: right_down
                    until:
                      y_ref: bottom_cover
                      y_offset: "dia * 1"

          # N8
          - id: N8
            category: 弯起钢筋
            subtype: 单段弯起
            dia: 28
            mirror: longitudinal
            z_pattern: pattern_2

            control_definition:
              reference_axis: pier_centerline_x
              bend_angle: 45

              key_points:
                bend_start_point:
                  x_expr: "pier_centerline_x - (300 + 800)"
                  y_ref: top_cover
                  y_offset: "dia * 1"

              branch_rules:
                main_branch:
                  start_from: bend_start_point
                  direction: left_down
                  until:
                    y_ref: bottom_cover
                    y_offset: "dia * 1"

          # N9
          - id: N9
            category: 弯起钢筋
            subtype: 单段弯起
            dia: 28
            mirror: longitudinal
            z_pattern: pattern_2

            control_definition:
              reference_axis: pier_centerline_x
              bend_angle: 45

              key_points:
                bend_start_point:
                  x_expr: "pier_centerline_x + (300 + 750)"
                  y_ref: top_cover
                  y_offset: "dia * 1"

              branch_rules:
                main_branch:
                  start_from: bend_start_point
                  direction: right_down
                  until:
                    y_ref: bottom_cover
                    y_offset: "dia * 1"

        # 5. 箍筋定义
        stirrups:
          longitudinal_distribution:
            - name: left_blank
              x_from: "- cap_length / 2"
              x_to: "-(cap_length / 2 - 150-cover_x)"
              spacing: "150 + cover_x"

            - name: 墩柱左侧加密区
