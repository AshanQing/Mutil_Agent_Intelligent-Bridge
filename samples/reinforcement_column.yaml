示例1:

  输入:

    基本信息:
      drawing_id: 14                   # 图纸或案例编号
      pier_role: 边墩                     # 墩位角色，如中间墩
      pier_type: 柱式墩              # 墩柱结构形式

    墩柱几何信息:
      column_count: 2                  # 墩柱数量
      column_diameter: 1800            # 墩柱直径，单位：mm
      column_height: 11769              # 墩柱高度，单位：mm
      column_spacing: 7250              # 多柱式桥墩墩柱中心间距，单位：mm

    保护层与控制参数:
      concrete_cover: 45             # 墩柱纵向主筋N1外缘至混凝土表面的距离，单位：mm

      # 墩柱局部竖向坐标系：
      # y = 0：柱底
      # y = column_height：柱顶，即盖梁底
      # y > column_height：伸入盖梁内部
      # y轴竖直向上为正


  输出:

    reinforcement:

      pier_column:

        # ============================================================
        # N1 墩柱纵向主筋
        # ============================================================
        longitudinal_bars:

          - id: N1
            category: 主筋
            subtype: 墩柱纵向主筋
            dia: 28                   # N1钢筋直径，单位：mm
            count: 44                  # 单根墩柱截面内N1纵筋总根数

            section_definition:
              arrangement: circular_uniform    # 沿圆形截面环向均匀布置
              bar_centerline_diameter: "column_diameter - 2 * concrete_cover - dia"        # N1圆心所在圆的直径，单位：mm

            range_definition:
              y_start: 0                       # N1起点位于柱底
              y_end: "column_height + 1600"      # N1终点竖向坐标，包含伸入盖梁部分，单位：mm


        # ============================================================
        # N2 墩柱螺旋箍筋
        # ============================================================
        spiral_stirrups:

          - id: N2
            category: 箍筋
            subtype: 墩柱螺旋箍筋
            dia: 10                     # N2螺旋箍筋钢筋直径，单位：mm

            section_definition:
              hoop_diameter: "column_diameter - 2 * concrete_cover + dia"        # N2钢筋中心线形成的圆直径，单位：mm
              enclosed_rebar: N1               # N2包围N1纵向主筋

            vertical_distribution:

              - name: 柱底加密区
                y_from: 0                      # 柱底加密区起点坐标，单位：mm
                y_to: "100 * 27"               # 柱底加密区终点坐标，单位：mm
                pitch: 100                     # 本案例螺旋箍筋螺距，单位：mm

              - name: 柱身普通区
                y_from: "100 * 27"                       # 普通区起点坐标，单位：mm
                y_to: "100 * 27 + 150 * 42"    # 普通区终点坐标，单位：mm
                pitch: 150                     # 本案例螺旋箍筋螺距，单位：mm

              - name: 过渡调整区
                y_from: "100 * 27 + 150 * 42"                       # 普通区起点坐标，单位：mm
                y_to: "100 * 27 + 150 * 42 + 69"    # 普通区终点坐标，单位：mm
                pitch: 69                     # 本案例螺旋箍筋螺距，单位：mm

              - name: 柱顶加密区
                y_from: "100 * 27 + 150 * 42 + 69"                       # 柱顶加密区起点坐标，单位：mm
                y_to: "100 * 27 + 150 * 42 + 69 + 100 * 27 = column_height"                        # 柱顶加密区终点坐标，通常为柱顶，单位：mm
                pitch: 100                     # 本案例螺旋箍筋螺距，单位：mm

            distribution_overview:
              y_start: 0                       # N2总体布置起点
              y_end: column_height                          # N2总体布置终点，即柱顶
              segment_sequence:
                - { name: 柱底加密区, pitch: 100 }
                - { name: 柱身普通区, pitch: 150 }
                - { name: 过渡调整区, pitch: 69 }
                - { name: 柱顶加密区, pitch: 100 }


        # ============================================================
        # N3 柱顶伸入盖梁段普通箍筋
        # ============================================================
        ordinary_hoops:

          - id: N3
            category: 箍筋
            subtype: 柱顶伸入盖梁段普通箍筋
            dia: 10                     # N3普通箍筋钢筋直径，单位：mm

            section_definition:
              same_circle_as: N2                # N3与N2采用相同的箍筋圈位置

            distribution_overview:
              y_start: "column_height + 200"                        # N3第一道箍筋竖向坐标
              y_end:  "column_height + 200 * 7"                         # N3最后一道箍筋竖向坐标
              spacing: 200                      # 本案例普通箍筋竖向间距，单位：mm
              count: 7                           # N3普通箍筋总圈数


        # ============================================================
        # N4 墩柱
        # ============================================================
        strengthening_bars:

          - id: N4
            category: 加强筋
            subtype: 墩柱
            dia: 28                    # N4直径，单位：mm


            section_definition:
              hoop_diameter: 1615        # N4钢筋中心线形成的圆直径，单位：mm

            vertical_distribution:
              first_y: 884             # 第一圈N4距柱底的竖向坐标，单位：mm
              last_y: "column_height - first_y"              # 最后一圈N4的竖向坐标，单位：mm
              count: 6               # N4总圈数
              spacing: "(last_y - first_y)/(count - 1)"             # N4竖向间距，单位：mm

